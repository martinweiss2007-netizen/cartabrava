<script>
/* ==========================================================================
   PANTALLA FIJA · Carta Brava
   Nada se desliza: cada pantalla entra entera en el alto de la ventana.
   Si algo no entra, en este orden:
     1. se esconde lo decorativo,
     2. lo secundario pasa a un botón que abre una ventana emergente,
     3. la pantalla se achica un poco (zoom),
     4. las listas largas se parten en páginas con flechas ‹ ›,
     5. si todavía no entra, se achica lo que haga falta.
   ========================================================================== */
(function(){
const APP=document.getElementById("app");
const STORE=document.createElement("div");STORE.id="cbstore";STORE.hidden=true;document.body.appendChild(STORE);
const PAGES=new Map();let LASTKEY="",FITTING=false,POPS=[],PH=[];

/* ---------- qué pantalla es ---------- */
function key(){
  try{
    const p=S&&S.phase;
    if(p==="fd"&&FD){if(FD.step==="draft")return "fd:draft"+(FD.active!=null?":pick":FD.slots&&fdFull()?":full":"");return "fd:"+FD.step}
    if(p==="club"&&CL){if(CL.view==="open"&&CL.items&&CL.idx>=CL.items.length)return "club:sum";return "club:"+CL.view}
    if(p==="match")return "match";
    return p||"home";
  }catch(e){return "home"}
}

/* ---------- reglas por pantalla ----------
   hide: se esconde si no entra · pop: [selector, título, siempre?] pasa a ventana
   group: varias secciones juntas en una ventana que abre un botón existente
   auto: se abre sola como ventana · page: listas que se pueden paginar */
const LISTS=[".cbpop-b",".grid",".mkt",".sbcl",".objs",".packs",".plist",".rvlist",".achs",".feed",".libfx",".steps",".log",".tacs"];
function cfg(k){
  const fdOnce=FD&&FD.lib?"Tu camino":"Copa";
  const C={
    "home":{hide:[".fan"]},
    "draft":{hide:[".note"],pop:[[".panel.rules","Reglas",1]]},
    "match":{pop:[["section.panel:has(.log)","Relato",1]]},
    "fd:form":{hide:[".note"]},
    
    "fd:draft:pick":{auto:[".fdside",null,1]},
    "fd:draft:full":{hide:[".fdgrid > div > p.note",".pitchnote"]},
    "fd:pre":{pop:[[".fdgrid > section.panel","Once rival",1],[".fdgrid > div","Tu once",1],[".libwrap > section.panel:nth-child(2)","Tu camino",1],[".libwrap > section.panel:first-child","Tabla",1],[".bracket",fdOnce,1]]},
    "fd:live":{pop:[["section.panel:has(#lstats)","Estadísticas",2]],after:liveFeed},
    "fd:result":{pop:[["section.panel:has(.feed)","Relato",1],["section.panel:has(.stl), section.panel:has(.stats)","Estadísticas",1],[".libwrap > section.panel:nth-child(2)","Tu camino",1],[".libwrap > section.panel:first-child","Tabla",1],[".bracket",fdOnce,1]]},
    "club:hub":{pop:[["section.panel:has(#svexp)","Tu partida",1],["section.panel:has(.objs)","Objetivos de hoy"]]},
    "club:squad":{pop:[[".fdgrid > section.panel","Ajustes del once",1]]},
    "club:sbc":{hide:[".fdgrid > section.panel > .note",".fdgrid > section.panel > .kicker"],pop:[[".fdgrid .reqs","Requisitos",1]]},
    "club:objs":{pop:[["section.panel:nth-of-type(3)","Hitos del club"],["section.panel:nth-of-type(2)","Objetivos de la semana"]]},
  };
  return C[k]||{};
}
/* el panel de estadísticas no tiene clase propia: lo marcamos por su etiqueta */
function tagStats(root){root.querySelectorAll("section.panel").forEach(s=>{const l=s.querySelector(".label");if(l&&/^Estad/i.test(l.textContent.trim()))s.classList.add("stats")})}

/* ---------- utilidades ---------- */
let roSkip=0;
/* alto de pantalla estable: mientras escribís (teclado abierto) se usa el último alto sin teclado */
let STABLE=window.innerHeight;
const typing=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
const vh=()=>{const v=Math.round(window.innerHeight);if(!typing()||v>STABLE)STABLE=v;return STABLE};
/* ¿se pasa del alto? Se mide el alto real del diseño (las animaciones con transform no cuentan) */
function over(el){
  const isApp=el===APP,prop=isApp?"height":"maxHeight",keep=el.style[prop],lim=parseFloat(keep);
  if(!lim)return el.scrollHeight>el.clientHeight+1;
  el.style[prop]=isApp?"auto":"none";const hh=el.offsetHeight;el.style[prop]=keep;return hh>lim+1;
}
function titleOf(el,fb){const h=el.querySelector("h2,.label");if(!h)return fb||"Más";const c=h.cloneNode(true);c.querySelectorAll("small").forEach(s=>s.remove());const t=c.textContent.trim();return t.length>28?(fb||t.slice(0,26)+"…"):(t||fb)}
function setZ(box,z,h,isApp){box.style.zoom=z>=.999?"":String(z);
  if(isApp){box.style.height=(h/z)+"px";box.style.maxWidth=(980/z)+"px";box.style.setProperty("--cbH",(h/z)+"px")}
  else{if(!box._bw){box.style.maxWidth="";const mw=parseFloat(getComputedStyle(box).maxWidth)||440;box._bw=Math.min(mw,window.innerWidth-24)}
    box.style.maxHeight=(h/z)+"px";box.style.maxWidth=(box._bw/z)+"px"}}
/* el tamaño más grande (de 1 para abajo) en el que todo entra */
function zoomFit(box,h,isApp,min){
  let z=parseFloat(box.style.zoom)||1;setZ(box,z,h,isApp);if(!over(box))return z;
  const steps=[];for(let t=z-.03;t>min;t-=.03)steps.push(+t.toFixed(3));steps.push(min);
  for(const t of steps){setZ(box,t,h,isApp);if(!over(box)){
      /* afinar para arriba entre t y t+.03 */
      let lo=t,hi=Math.min(z,t+.03);for(let i=0;i<4;i++){const m=(lo+hi)/2;setZ(box,m,h,isApp);if(over(box))hi=m;else lo=m}
      setZ(box,lo,h,isApp);return lo}}
  return min;
}

/* ---------- paginado ---------- */
function paginate(box,list,pk,isOver){
  const items=[...list.children].filter(x=>!x.classList.contains("cbpager"));
  if(items.length<2)return false;
  const pager=document.createElement("div");pager.className="cbpager";
  pager.innerHTML=`<button type="button" class="btn ghost sm" data-pg="-1" aria-label="Página anterior">‹</button><span></span><button type="button" class="btn ghost sm" data-pg="1" aria-label="Página siguiente">›</button>`;
  list.after(pager);
  let first=PAGES.get(pk)||0;
  const show=(k,start)=>{items.forEach((it,i)=>it.classList.toggle("cbhid",i<start||i>=start+k))};
  /* columnas de la grilla, para cortar filas enteras */
  show(items.length,0);
  const t0=items[0].offsetTop;let cols=items.filter(x=>x.offsetTop===t0).length||1;
  let lo=1,hi=items.length,best=1;
  while(lo<=hi){const m=(lo+hi)>>1;show(m,0);if(isOver())hi=m-1;else{best=m;lo=m+1}}
  let k=best;if(k>cols)k-=k%cols;
  if(k>=items.length){pager.remove();show(items.length,0);return false}
  const pages=Math.ceil(items.length/k);
  let p=Math.min(Math.floor(first/k),pages-1);
  const draw=()=>{show(k,p*k);PAGES.set(pk,p*k);pager.querySelector("span").textContent=`${p+1} / ${pages}`;
    pager.querySelector('[data-pg="-1"]').disabled=p===0;pager.querySelector('[data-pg="1"]').disabled=p===pages-1};
  pager.querySelectorAll("[data-pg]").forEach(b=>b.onclick=e=>{e.stopPropagation();p=Math.max(0,Math.min(pages-1,p+ +b.dataset.pg));draw()});
  draw();return true;
}
function paginateAll(box,h,isApp,kk){
  const lists=[...box.querySelectorAll(LISTS.join(","))].filter(l=>!l.closest(".cbhid")&&l.children.length>1&&!l.closest("#cbstore"))
    .sort((a,b)=>b.offsetHeight-a.offsetHeight);
  lists.forEach((l,i)=>{if(over(box))paginate(box,l,kk+"|"+i,()=>over(box))});
}

/* ---------- ventanas emergentes ---------- */
function closePop(pop,silent){
  const i=POPS.indexOf(pop);if(i>=0)POPS.splice(i,1);
  pop.querySelectorAll(".cbdup").forEach(x=>x.classList.remove("cbdup"));
  pop.querySelectorAll("[data-cbmoved]").forEach(n=>{n.removeAttribute("data-cbmoved");STORE.appendChild(n)});
  pop.remove();if(!silent&&pop._onClose)pop._onClose();
}
function openPop(title,nodes,onClose,locked){
  const m=document.createElement("div");m.className="modal cbpop"+(locked?" locked":"");m._onClose=onClose;m._locked=!!locked;
  m.innerHTML=`<div class="mbox cbpop-box" role="dialog" aria-modal="true" aria-label="${title.replace(/"/g,"&quot;")}"><div class="cbpop-h"><h2>${title}</h2><button type="button" class="btn ghost sm cbx" aria-label="Cerrar">✕</button></div><div class="cbpop-b"></div></div>`;
  const b=m.querySelector(".cbpop-b");nodes.forEach(n=>{n.setAttribute("data-cbmoved","1");b.appendChild(n)});
  /* si la sección ya tiene el mismo título, no lo repetimos */
  const norm=t=>(t||"").replace(/\s+/g," ").trim().toLowerCase();
  b.querySelectorAll(".cbdup").forEach(x=>x.classList.remove("cbdup"));
  const fh=b.querySelector("h2, .label");if(fh&&norm(titleOf(nodes[0],""))===norm(title))fh.classList.add("cbdup");
  document.body.appendChild(m);POPS.push(m);
  if(locked)m.querySelector(".cbx").remove();
  else{m.querySelector(".cbx").onclick=()=>closePop(m);m.onclick=e=>{if(e.target===m)closePop(m)}}
  fitModal(m.querySelector(".mbox"));
  const f=m.querySelector(".cbx");try{if(f)f.focus({preventScroll:true})}catch(e){}
  return m;
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&POPS.length&&!POPS[POPS.length-1]._locked)closePop(POPS[POPS.length-1])});
function fitModal(box){
  if(!box||!box.isConnected)return;
  box.querySelectorAll(".cbpager").forEach(p=>p.remove());box.querySelectorAll(".cbhid").forEach(x=>x.classList.remove("cbhid"));
  const h=Math.floor(vh()*.92);box.style.overflow="hidden";
  setZ(box,1,h,false);if(!over(box))return;
  const big=[...box.querySelectorAll(LISTS.join(","))].some(l=>l.children.length>8);
  zoomFit(box,h,false,big?.8:.72);if(!over(box))return;
  paginateAll(box,h,false,"modal:"+(box.querySelector("h2")||{}).textContent);
  zoomFit(box,h,false,.4);
}

/* ---------- dock de botones para lo que pasó a ventana ---------- */
function dockBtn(title,nodes,onOpen){
  let d=APP.querySelector(".cbdock");
  if(!d){d=document.createElement("nav");d.className="cbdock";d.setAttribute("aria-label","Más información");APP.appendChild(d)}
  const b=document.createElement("button");b.type="button";b.className="btn ghost sm";b.textContent=title;
  b.onclick=()=>{if(onOpen)onOpen();openPop(title,nodes)};d.appendChild(b);return b;
}
function popOut(els,title,existingBtn){
  els=els.filter(e=>e&&e.isConnected&&APP.contains(e));if(!els.length)return false;
  els.forEach(e=>{const ph=document.createComment("cb");e.before(ph);PH.push([ph,e]);STORE.appendChild(e)});
  if(existingBtn){existingBtn.onclick=e=>{e.preventDefault();openPop(title,els)};return true}
  dockBtn(title,els);return true;
}

/* ---------- partido en vivo: el relato ocupa el espacio que queda ---------- */
function liveFeed(){
  const f=APP.querySelector(".feed");if(!f)return;
  f.style.height="0px";f.style.maxHeight="none";f.style.overflow="hidden";
  const H=APP.clientHeight,keep=APP.style.height;APP.style.height="auto";
  const used=APP.scrollHeight;APP.style.height=keep; /* alto real con el relato vacío */
  f.style.height=Math.max(80,H-used-4)+"px";
}

/* ---------- cartas en fila (la mano): que entren a lo ancho ---------- */
function fitRows(root){
  root.querySelectorAll(".hand").forEach(h=>{
    [...h.children].forEach(c=>c.style.zoom="");
    h.style.overflowX="visible";
    const sw=h.scrollWidth,cw=h.clientWidth;
    if(sw>cw+1){const z=Math.max(.3,(cw-2)/sw);[...h.children].forEach(c=>c.style.zoom=String(z))}
  });
}

/* ---------- botón de diseño: vive en el inicio, al lado de "Cómo se juega" ---------- */
function placeTheme(k){}
function parkTheme(){const t=document.getElementById("temabtn");if(t&&APP.contains(t))STORE.appendChild(t)}

/* ---------- el ajuste principal ---------- */
function fit(){
  if(FITTING)return;FITTING=true;
  try{
    const k=key();
    if(k!==LASTKEY){PAGES.clear();LASTKEY=k}
    POPS.slice().forEach(p=>closePop(p,true));
    PH.forEach(([ph,e])=>{if(ph.isConnected)ph.replaceWith(e)});PH=[];
    STORE.querySelectorAll(":scope > :not(#temabtn)").forEach(x=>x.remove());
    APP.querySelectorAll(".cbdock,.cbpager").forEach(x=>x.remove());
    APP.querySelectorAll(".cbhid").forEach(x=>x.classList.remove("cbhid"));
    APP.scrollTop=0;window.scrollTo(0,0);
    tagStats(APP);placeTheme(k);
    const c=cfg(k),h=vh();
    setZ(APP,1,h,true);fitRows(APP);
    const q=s=>{try{return [...APP.querySelectorAll(s)]}catch(e){return []}};
    /* ventana que se abre sola (elegir jugador en el draft) */
    if(c.auto){const els=q(c.auto[0]);if(els.length){els.forEach(e=>{const ph=document.createComment("cb");e.before(ph);PH.push([ph,e]);STORE.appendChild(e)});openPop(titleOf(els[0],"Elegí"),els,c.auto[1],c.auto[2])}}
    /* grupo atado a un botón que ya existe */
    if(c.group){const els=q(c.group.sel),btn=APP.querySelector(c.group.btn);if(els.length)popOut(els,c.group.title,btn)}
    /* lo que siempre va a ventana en celu */
    const narrow=window.innerWidth<820;
    (c.pop||[]).forEach(([s,t,always])=>{if(always&&(over(APP)||(always===2&&narrow))){const els=q(s);if(els.length)popOut(els,t)}});
    if(c.after)c.after();
    if(over(APP)){
      (c.hide||[]).forEach(s=>q(s).forEach(e=>{if(over(APP))e.classList.add("cbhid")}));
      (c.pop||[]).forEach(([s,t,always])=>{if(!always&&over(APP)){const els=q(s);if(els.length)popOut(els,t)}});
      if(c.after)c.after();
    }
    const big=[...APP.querySelectorAll(LISTS.join(","))].some(l=>!l.closest("#cbstore")&&l.children.length>8);
    if(over(APP)){zoomFit(APP,h,true,big?.8:.62);fitRows(APP)}
    if(over(APP)){paginateAll(APP,h,true,k);}
    if(over(APP)){zoomFit(APP,h,true,.42);fitRows(APP)}
    if(c.after)c.after();
    APP.scrollTop=0;
  }catch(e){console.warn("fit",e)}
  FITTING=false;roSkip=Date.now();
}
let raf=0;const schedule=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(fit)};
/* cada vez que el juego dibuja una pantalla, se ajusta en el momento */
const _render=window.render;
window.render=function(){POPS.slice().forEach(p=>closePop(p,true));PH=[];parkTheme();const r=_render.apply(this,arguments);fit();return r};

/* cambios de tamaño adentro de la pantalla (cartas que se revelan, toasts): reajustar si se pasa */
let roT=0;const ro=new ResizeObserver(()=>{if(FITTING||Date.now()-roSkip<200)return;clearTimeout(roT);roT=setTimeout(()=>{if(!FITTING&&over(APP)&&!POPS.length)fit()},120)});
new MutationObserver(()=>{[...APP.children].forEach(c=>ro.observe(c))}).observe(APP,{childList:true});

/* rotar el celu o cambiar el tamaño de la ventana (pero no cuando aparece el teclado) */
let lastW=window.innerWidth,lastH=vh();
const onResize=()=>{const a=document.activeElement;const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  const w=window.innerWidth,hh=vh();if(typing&&w===lastW)return;if(w===lastW&&Math.abs(hh-lastH)<40)return;lastW=w;lastH=hh;
  schedule();document.querySelectorAll(".modal .mbox").forEach(fitModal)};
window.addEventListener("resize",onResize);window.addEventListener("orientationchange",()=>setTimeout(onResize,250));

/* ventanas que ya tenía el juego (ficha de carta, elegir jugador) */
new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{
  if(n.nodeType===1&&n.classList.contains("modal")&&!n.classList.contains("cbpop")){
    const box=n.querySelector(".mbox");requestAnimationFrame(()=>fitModal(box));
    const pl=n.querySelector(".plist");if(pl)new MutationObserver(()=>requestAnimationFrame(()=>fitModal(box))).observe(pl,{childList:true});
  }}))}).observe(document.body,{childList:true});

/* nada de scroll por código */
const sIV=Element.prototype.scrollIntoView;Element.prototype.scrollIntoView=function(){};
window.scrollTo=function(){};
APP.addEventListener("scroll",()=>{APP.scrollTop=0});

fit();
})();
</script>
