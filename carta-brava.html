<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carta Brava</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;700;800&family=Archivo+Narrow:wght@500;600;700&family=Russo+One&family=Saira:wght@400;600;700&display=swap">
<style>
/* Layout: álbum de figuritas — marcador arriba, cancha de duelo al centro, tu mano abajo */
:root{
  --pitch:#f1e6cb; --pitch-2:#ece0c2; --line:rgba(36,33,28,.25);
  --chalk:#24211c; --muted:#6b5e45; --ink:#24211c;
  --amber:#f2c230; --goal:#c8322a; --save:#2f7fc1; --acc:#c8322a;
  --f-display:"Alfa Slab One","Rockwell",Georgia,serif;
  --f-cond:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--pitch);color:var(--chalk)}
body{font-family:var(--f-body);min-height:100%;
  background:
    repeating-linear-gradient(90deg,var(--pitch) 0 64px,var(--pitch-2) 64px 128px);
}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,46px);line-height:1;margin:0;letter-spacing:.5px;text-wrap:balance}
h1 span{color:var(--acc)}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px;max-width:62ch}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.record{font-family:var(--f-cond);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.record b{color:var(--chalk)}
.panel{border:2px solid var(--line);border-radius:14px;padding:14px;background:rgba(0,0,0,.18)}
.row-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.label{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--muted)}
.label b{color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
.hand{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scroll-snap-type:x proximity}
.hand .card{flex:0 0 128px;scroll-snap-align:start}
button{font:inherit;color:inherit;cursor:pointer}
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:.5px;padding:10px 18px;border-radius:999px;border:0;background:var(--amber);color:var(--ink);box-shadow:0 3px 0 #b97f0c}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid var(--line);box-shadow:none}
.btn:focus-visible,.card:focus-visible,.play:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

/* ---------- carta ---------- */
.card{position:relative;border:0;padding:0;border-radius:12px;background:#fff;color:var(--ink);text-align:left;
  box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 2px rgba(255,255,255,.9) inset;overflow:hidden;transition:transform .15s ease, box-shadow .15s}
.card .art{position:relative;aspect-ratio:4/3.3;max-width:100%;overflow:hidden}
.card .art svg{position:absolute;inset:auto 0 0 0;width:100%;height:auto}
.card .ovr{position:absolute;top:0;left:0;z-index:2;background:#fff;color:var(--ink);font-family:var(--f-display);font-size:24px;line-height:1;
  padding:6px 9px 7px 7px;border-bottom-right-radius:16px;font-variant-numeric:tabular-nums}
.card .pos{position:absolute;top:6px;right:6px;z-index:2;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.06em;
  background:var(--ink);color:#fff;padding:2px 6px;border-radius:6px}
.card .chem{position:absolute;top:30px;right:6px;z-index:2;font-family:var(--f-cond);font-weight:700;font-size:11px;background:var(--amber);color:var(--ink);padding:1px 5px;border-radius:6px}
.card .plate{padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--ink)}
.card .nm{font-family:var(--f-display);font-size:16px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cl{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#4c5a52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:2px}
.card .st div{background:#eef0e9;border-radius:5px;text-align:center;padding:2px 0;font-variant-numeric:tabular-nums}
.card .st i{display:block;font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:10px;color:#6a776f;letter-spacing:.05em}
.card .st b{font-family:var(--f-cond);font-weight:700;font-size:15px}
.card .st b.up{color:#0b7a3e}
.card.sel{transform:translateY(-6px);box-shadow:0 10px 0 rgba(0,0,0,.35),0 0 0 4px var(--amber)}
.card.used{opacity:.25;pointer-events:none;filter:grayscale(1)}
.card.dim{opacity:.55}
.card .swap{position:absolute;bottom:auto;top:58px;right:6px;z-index:3;font-family:var(--f-cond);font-weight:700;font-size:11px;border:0;border-radius:6px;padding:3px 6px;background:var(--ink);color:var(--acc)}
.back{flex:0 0 64px;height:88px;border-radius:10px;background:
  repeating-linear-gradient(45deg,#1d5a3d 0 8px,#174a32 8px 16px);border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;
  font-family:var(--f-display);color:var(--acc);font-size:22px}
.back.used{opacity:.2}

/* ---------- partido ---------- */
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:#0a1712;border:2px solid #2a3a31;border-radius:14px;padding:10px 14px}
.team{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team.r{text-align:right}
.score{font-family:var(--f-display);font-size:40px;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 18px rgba(255,182,39,.35)}
.meta{grid-column:1/-1;display:flex;justify-content:center;gap:14px;font-family:var(--f-cond);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex-wrap:wrap}
.dots{display:flex;gap:5px;align-items:center}
.dots span{width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.dots span.g{background:var(--goal);border-color:var(--goal)}
.dots span.s{background:var(--save);border-color:var(--save)}
.dots span.now{border-color:var(--amber)}
.field{position:relative;border:2px solid var(--line);border-radius:14px;padding:16px;min-height:260px;display:flex;flex-direction:column;align-items:center;gap:14px;
  background:radial-gradient(circle at 50% 50%,transparent 0 62px,var(--line) 62px 64px,transparent 64px),linear-gradient(90deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.call{font-family:var(--f-display);font-size:clamp(20px,4.4vw,28px);text-align:center;text-wrap:balance;margin:0}
.call small{display:block;font-family:var(--f-body);font-size:14px;color:var(--muted);margin-top:4px}
.duel{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.duel .card{width:136px}
.vs{font-family:var(--f-display);font-size:22px;color:var(--acc);text-align:center;min-width:60px;font-variant-numeric:tabular-nums}
.vs small{display:block;font-family:var(--f-cond);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.plays{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.play{border:2px solid var(--line);background:rgba(0,0,0,.25);border-radius:12px;padding:10px 14px;min-width:132px;text-align:left}
.play b{display:block;font-family:var(--f-display);font-size:18px;font-weight:400}
.play span{font-family:var(--f-cond);font-size:13px;color:var(--muted);letter-spacing:.03em}
.play em{font-style:normal;color:var(--acc);font-family:var(--f-display);font-size:18px;float:right;margin-left:10px}
.play:hover{border-color:var(--amber)}
.verdict{font-family:var(--f-display);font-size:clamp(34px,9vw,58px);line-height:1;letter-spacing:1px}
.verdict.g{color:var(--goal)} .verdict.s{color:var(--save)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.verdict{animation:pop .45s ease-out both}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.log{font-family:var(--f-cond);font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px;letter-spacing:.02em}
.log b{color:var(--chalk)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;font-size:14px;color:var(--muted)}
.rules b{color:var(--chalk);font-family:var(--f-cond);font-size:15px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:2px}
.note{font-size:12px;color:var(--muted);opacity:.85}
/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;padding-block:18px 8px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.kicker{font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:14px;color:var(--acc);margin:0 0 10px}
.big{font-family:var(--f-display);font-weight:400;font-size:clamp(48px,11vw,96px);line-height:.92;margin:0;letter-spacing:.5px;text-wrap:balance}
.big span{color:var(--acc);display:block}
.lead{font-size:18px;line-height:1.5;color:var(--chalk);max-width:46ch;margin:16px 0 22px}
.ctrl.left{justify-content:flex-start}
.btn.big{font-size:22px;padding:13px 26px}
.hero .record{margin-top:16px}
.fan{display:flex;justify-content:center;padding:18px 0 10px}
.fan .card{width:150px;flex:0 0 150px;pointer-events:none}
.fan .card:nth-child(1){transform:rotate(-9deg) translate(26px,14px)}
.fan .card:nth-child(2){z-index:2;transform:translateY(-6px)}
.fan .card:nth-child(3){transform:rotate(9deg) translate(-26px,14px)}
@media (max-width:420px){.fan .card{width:118px;flex-basis:118px}}
h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 14px;letter-spacing:.3px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;counter-reset:s}
.steps li{counter-increment:s;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.45;color:var(--muted)}
.steps li::before{content:counter(s);margin-bottom:4px;font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ink);background:var(--amber);border-radius:10px;width:42px;height:42px;display:grid;place-items:center}
.steps b{color:var(--chalk);font-family:var(--f-cond);font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.playinfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.playinfo div{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted);line-height:1.45}
.playinfo b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--chalk)}
.gloss{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-family:var(--f-cond);font-size:15px;letter-spacing:.03em;color:var(--muted)}
.gloss b{color:var(--acc)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mini .logo{font-family:var(--f-display);font-size:26px;line-height:1}
.mini .logo span{color:var(--acc)}
.btn.sm{font-size:15px;padding:7px 14px}
/* ---------- modos ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:620px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;border-radius:14px;padding:14px 16px;background:var(--amber);color:var(--ink);box-shadow:0 4px 0 #b97f0c}
.mode.alt{background:var(--save);box-shadow:0 4px 0 #2b86b3}
.mode i{font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.mode b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05}
.mode span{font-size:14px;line-height:1.35}
.mode em{font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;margin-top:4px;font-variant-numeric:tabular-nums}
.mode:hover{transform:translateY(-2px)}
.mode:focus-visible,.formbtn:focus-visible,.slot:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.card .nat{display:inline-block;background:var(--ink);color:#fff;border-radius:4px;padding:0 4px;margin-right:4px;font-size:10px;letter-spacing:.06em}
/* ---------- FUT draft ---------- */
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.formbtn{border:2px solid var(--line);background:rgba(0,0,0,.25);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.formbtn b{font-family:var(--f-display);font-weight:400;font-size:30px;color:var(--acc)}
.formbtn span{font-family:var(--f-cond);font-size:14px;color:var(--muted);letter-spacing:.04em}
.formbtn:hover{border-color:var(--amber)}
.fdgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.fdgrid{grid-template-columns:1fr}}
.fdstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.fdstats div{background:#0a1712;border:2px solid #2a3a31;border-radius:12px;padding:8px 10px}
.fdstats i{display:block;font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fdstats b{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--acc);font-variant-numeric:tabular-nums}
.fdstats small{font-size:15px;color:var(--muted)}
.pitchfd{position:relative;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:14px;border:2px solid var(--line);overflow:hidden;
  background:
   radial-gradient(circle at 50% 50%,transparent 0 14%,var(--line) 14% calc(14% + 2px),transparent calc(14% + 2px)),
   linear-gradient(180deg,transparent calc(50% - 1px),var(--line) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
   repeating-linear-gradient(180deg,var(--pitch) 0 10%,var(--pitch-2) 10% 20%)}
.pitchfd::before,.pitchfd::after{content:"";position:absolute;left:28%;right:28%;height:13%;border:2px solid var(--line)}
.pitchfd::before{top:-2px;border-top:0}
.pitchfd::after{bottom:-2px;border-bottom:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:clamp(54px,16%,82px);border:0;padding:0;background:none;z-index:1}
.slot .empty{display:grid;place-items:center;aspect-ratio:1;width:100%;border-radius:50%;border:2px dashed rgba(243,241,231,.5);background:rgba(0,0,0,.25);
  font-family:var(--f-display);font-size:18px;color:var(--chalk);line-height:1}
.slot .empty b{font-family:var(--f-cond);font-size:12px;letter-spacing:.06em;display:block}
button.slot:hover .empty{border-color:var(--amber);color:var(--acc)}
.slot.active .empty{border-style:solid;border-color:var(--amber);background:rgba(255,182,39,.2)}
.mc{background:#fff;color:var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35);text-align:center}
.mc-top{height:18px;display:flex;justify-content:space-between;align-items:flex-start;padding:2px}
.mc-ovr,.mc-cap{font-family:var(--f-display);font-size:13px;line-height:1;background:#fff;border-radius:4px;padding:1px 3px}
.mc-cap{background:var(--amber)}
.mc-face{height:30px;overflow:hidden;position:relative;margin-top:-6px}
.mc-face svg{position:absolute;left:0;right:0;top:-2px;width:100%}
.mc-nm{font-family:var(--f-cond);font-weight:700;font-size:11px;line-height:1.1;padding:2px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:2px solid var(--ink)}
.mc-ch{display:flex;justify-content:center;padding:1px 0 3px}
.mc-ch span{font-family:var(--f-display);font-size:11px;line-height:1;color:#fff;border-radius:4px;padding:2px 5px;font-variant-numeric:tabular-nums}
.mc-ch .hi{background:#0b9a4c}.mc-ch .mid{background:#d99a00}.mc-ch .lo{background:#d23a26}
:root{--link-g:#38e07b;--link-y:#ffcf3a;--link-r:#ff5a43}
.pitchfd .links{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-family:var(--f-cond);font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.chemhelp{margin-top:12px;font-size:14px;line-height:1.5;color:var(--muted)}
.chemhelp b{color:var(--acc);font-family:var(--f-cond);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.fdopts{margin-top:12px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.btn.alt{background:var(--save);box-shadow:0 3px 0 #2b86b3}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.bracket{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bracket div{border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.bracket i{display:block;font-style:normal;font-family:var(--f-cond);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bracket b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bracket span{font-family:var(--f-cond);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bracket .now{border-color:var(--amber)}
.bracket .w{border-color:#2fbf71}
.bracket .l{border-color:var(--goal);opacity:.75}
.rvlist{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:14px}
.rvlist div{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:3px 0;min-width:0}
.rvlist .pos{font-family:var(--f-cond);font-weight:700;font-size:11px;background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px;flex:none}
.rvlist b{margin-left:auto;font-family:var(--f-display);font-weight:400;color:var(--acc);font-variant-numeric:tabular-nums}
/* ---------- cartas especiales ---------- */
.card.sp-gold{background:linear-gradient(160deg,#fbe7a1,#d9a93b)}
.card.sp-gold .ovr{background:#fbe7a1}
.card.sp-gold .st div{background:rgba(255,255,255,.55)}
.card.sp-gold .cl{color:#5b4512}
.card.sp-leg{background:linear-gradient(160deg,#2d2d2d,#0b0b0b);color:#ffd76a;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 2px #ffd76a inset}
.card.sp-leg .ovr{background:#ffd76a;color:#111}
.card.sp-leg .plate{border-top-color:#ffd76a}
.card.sp-leg .cl{color:#cbb26a}
.card.sp-leg .st div{background:#262626}
.card.sp-leg .st i{color:#b9a86d}
.card.sp-form{background:linear-gradient(160deg,#1c241d,#050806);color:#c6ff4a;box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 2px #c6ff4a inset}
.card.sp-form .ovr{background:#c6ff4a;color:#111}
.card.sp-form .plate{border-top-color:#c6ff4a}
.card.sp-form .cl{color:#9fcf3a}
.card.sp-form .st div{background:#1f261f}
.card.sp-form .st i{color:#9fb88a}
.card .spb{position:absolute;left:6px;top:42px;z-index:3;font-family:var(--f-cond);font-weight:700;font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:5px;background:#111;color:#ffd76a}
.card.sp-form .spb{color:#c6ff4a}
.mc.sp-gold{background:#f6dc8a}
.mc.sp-leg{background:#151515;color:#ffd76a}
.mc.sp-form{background:#0b0f0c;color:#c6ff4a}
.mc.sp-leg .mc-nm{border-top-color:#ffd76a}.mc.sp-form .mc-nm{border-top-color:#c6ff4a}
/* ---------- partido en vivo ---------- */

/* ---------- logros y compartir ---------- */

.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,9,.82);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{background:var(--pitch);border:2px solid var(--line);border-radius:16px;padding:14px;max-width:440px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}

/* ---------- animaciones del draft ---------- */
@keyframes deal{0%{opacity:0;transform:perspective(700px) rotateY(95deg) translateY(30px) scale(.85)}60%{opacity:1;transform:perspective(700px) rotateY(-8deg) translateY(-4px) scale(1.02)}100%{opacity:1;transform:none}}

.picking{pointer-events:none}
.picking>.picked{animation:none;transform:translateY(-10px) scale(1.07);box-shadow:0 0 0 4px var(--amber),0 18px 40px rgba(255,182,39,.45);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;z-index:2}
.picking>.gone{animation:none;opacity:0;transform:scale(.8) translateY(14px);filter:grayscale(1);transition:opacity .3s,transform .3s,filter .3s}

.opening{min-height:420px;display:grid;place-items:center;border-radius:18px;border:2px solid var(--line);background:radial-gradient(circle at 50% 40%,#1f5a3d,#0a1712 70%);overflow:hidden;position:relative}

.opening.walk::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,215,106,.12) 0 8deg,transparent 8deg 22deg);animation:rays 14s linear infinite}

@keyframes flipin{0%{opacity:0;transform:perspective(800px) rotateY(180deg) scale(.6)}60%{opacity:1;transform:perspective(800px) rotateY(-10deg) scale(1.08)}100%{transform:none}}

.plist{max-height:none!important;overflow:visible!important}
.cbpop-box{max-width:min(720px,100%)}
.cbpop-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cbpop-h h2{margin:0;font-size:clamp(20px,5vw,28px)}
.cbpop-b{display:flex;flex-direction:column;gap:12px}
.cbpop-b .feed{max-height:none;overflow:visible}
.cbpop-b>.panel,.cbpop-b>section{margin:0}
.cbpop-b .fdside,.cbpop-b>.panel{border:0;box-shadow:none;padding:0;background:none}
/* el relato del partido en vivo no crece: lo nuevo queda arriba */
.feed{overflow:hidden!important}
/* pestañas del club: compactas, 4 por fila */
.tabs{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tabs .tab{padding:6px 4px;font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* logros que aparecen: flotan arriba y se van solos */
#app .toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:70;width:min(92vw,420px);margin:0;animation:cbtoast 5s ease forwards;pointer-events:none}
@keyframes cbtoast{0%{opacity:0;transform:translate(-50%,-16px)}8%,82%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px);visibility:hidden}}
@media (prefers-reduced-motion:reduce){#app .toast{animation:cbtoast-r 5s forwards}@keyframes cbtoast-r{0%,85%{opacity:1}100%{opacity:0;visibility:hidden}}}

/* inicio del club: tarjetas de a dos */
@media (max-width:620px){.hubgrid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.hubgrid .htile{padding:10px}}
/* botón de diseño, en el inicio al lado de "Cómo se juega" */
.cbhowrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.cbhowrow #how{margin-top:0!important}

.modal .mbox{box-sizing:border-box}
.cbdup{display:none!important}
/* lo que crece con el ancho se ata al alto de la pantalla */
#app{--cbH:100dvh}
#app .pitchfd{max-width:min(100%,calc(var(--cbH) * .56 * .75));margin-inline:auto}
#app .fprev{max-width:min(140px,calc(var(--cbH) * .15))}
#app .hero{overflow:hidden}
.bench{margin-top:10px}.bench .label{margin:0 0 4px}.bench .label small{opacity:.7}
.benchrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.benchrow .slot{position:relative;left:auto;top:auto;transform:none;width:100%}
.benchrow .mc-ch{display:none}
.slot.sel .mc{outline:3px solid var(--acc,#c8322a);outline-offset:2px;transform:translateY(-3px)}
.slot{cursor:pointer}.slot .offpos,.slot .bpos{position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);font-style:normal;font-family:var(--f-cond);font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:3px;background:var(--ink,#24211c);color:#fff;white-space:nowrap}
.slot .offpos{background:#c8322a}
.swaphint{font-size:14px;margin-top:6px}
.fdgrid.solo{grid-template-columns:1fr}.benchrow .slot .empty b{font-size:10px}
</style>

const rand=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let t=seed;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296}}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shortName(n){const p=n.split(" ");if(p.length===1)return n;return p[0][0]+". "+p.slice(1).join(" ")}

function head(p){
  const r=rng(hash(p.n)),pick=a=>a[Math.floor(r()*a.length)];
  const skin=pick(["#f2d0b1","#e8b98f","#d9a274","#c18656","#9c6640","#7a4a2c","#f6dcc4"]);
  let hair=pick(["#17110d","#2b1b12","#43291a","#5e3b22","#232323","#7b5230","#b8893f"]);
  let style=Math.floor(r()*6),beard=r();const grin=r()<.45;
  if(p.f){style=3;beard=1}if(p.gray)hair="#c8c4bc";
  const jersey=CLUBS[p.c],px=(r()-.5)*2.4,py=(r()-.5)*1.6;
  let back="",front="";
  if(style===3)back=`<path d="M20 42 Q18 8 50 8 Q82 8 80 42 L82 66 Q72 60 72 46 L28 46 Q28 60 18 66 Z" fill="${hair}"/>`;
  if(style===0||style===3)front=`<path d="M23 40 Q20 10 50 9 Q80 10 77 40 Q72 22 50 21 Q30 22 23 40Z" fill="${hair}"/>`;
  if(style===1)front=`<path d="M25 34 Q24 13 50 12 Q76 13 75 34 Q70 21 50 20 Q30 21 25 34Z" fill="${hair}" opacity=".8"/>`;
  if(style===2){let c="";for(let i=0;i<9;i++){const a=Math.PI*(1.05+i*0.11);c+=`<circle cx="${50+Math.cos(a)*24}" cy="${36+Math.sin(a)*25}" r="8" fill="${hair}"/>`}front=c}
  if(style===4)front=`<path d="M23 40 Q20 12 44 8 Q60 0 72 10 Q80 18 77 40 Q72 22 52 20 Q30 22 23 40Z" fill="${hair}"/>`;
  const brow=`<path d="M34 33 l11 -1.5 M55 31.5 l11 1.5" stroke="${hair}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  const eyes=`<ellipse cx="40" cy="41" rx="6" ry="6.5" fill="#fff"/><ellipse cx="60" cy="41" rx="6" ry="6.5" fill="#fff"/>
    <circle cx="${40+px}" cy="${42+py}" r="2.8" fill="#14201a"/><circle cx="${60+px}" cy="${42+py}" r="2.8" fill="#14201a"/>`;
  const nose=`<path d="M50 45 q-4 8 0 9" stroke="rgba(0,0,0,.28)" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  const mouth=grin?`<path d="M39 59 Q50 70 61 59 Z" fill="#5a1d1d"/><path d="M41 59.5 L59 59.5 L57 62 L43 62Z" fill="#fff"/>`
                  :`<path d="M41 60 Q50 66 59 60" stroke="#5a1d1d" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const bd=beard<.22?`<path d="M26 50 Q28 74 50 76 Q72 74 74 50 Q70 66 50 68 Q30 66 26 50Z" fill="${hair}" opacity=".92"/>`
         :beard<.4?`<path d="M27 50 Q29 74 50 76 Q71 74 73 50 Q70 68 50 70 Q30 68 27 50Z" fill="${hair}" opacity=".3"/>`:"";
  return `<svg viewBox="0 0 100 92" aria-hidden="true">
    <path d="M10 92 Q12 74 34 72 L66 72 Q88 74 90 92Z" fill="${jersey.c1}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>

    <ellipse cx="50" cy="42" rx="27" ry="31" fill="${skin}"/>
    ${bd}${front}${brow}${eyes}${nose}${mouth}
  </svg>`;
}

/* ---------- escudos (originales: forma de escudo con los colores y las iniciales del club) ---------- */
const CRABBR={};let CRN=0;
function abbr1(k){const c=CLUBS[k];
  const par=(c.n.match(/\(([^)]*)\)/)||[])[1]||"",stop=new Set(["de","del","la","las","los","el","y","fc","club","cd","ca","sc","ac","cf","sd","ad","se","cr","ec","fbc"]);
  const w=c.n.replace(/\([^)]*\)/,"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/'/g,"").split(/[\s\-.]+/).filter(x=>x&&!stop.has(x.toLowerCase())&&!/^\d+$/.test(x));
  const pi=par?par.normalize("NFD").replace(/[̀-ͯ]/g,"")[0]:"";
  const opts=w.length>=2?[w.slice(0,3).map(x=>x[0]).join(""),w[0][0]+w[w.length-1].slice(0,2),w[0].slice(0,2)+w[w.length-1][0],w[0].slice(0,3)]:[(w[0]||c.n).slice(0,3),(w[0]||c.n).slice(0,2)+(w[0]||c.n).slice(-1)];
  return (pi?opts.map(o=>o.slice(0,2)+pi):opts).map(o=>o.toUpperCase())}
function clubAbbr(k){if(!CRABBR.__){CRABBR.__=1;const used=new Set();Object.keys(CLUBS).forEach(x=>{const o=abbr1(x);const a=o.find(v=>!used.has(v))||o[0];used.add(a);CRABBR[x]=a})}
  return CRABBR[k]||""}
function crest(k){const c=CLUBS[k];if(!c)return "";const a=c.c1,b=c.c2,id="cr"+(++CRN);
  const pat={stripes:`<rect width="40" height="46" fill="${a}"/>${[8,24].map(x=>`<rect x="${x}" width="8" height="46" fill="${b}"/>`).join("")}`,
    band:`<rect width="40" height="46" fill="${a}"/><rect y="11" width="40" height="10" fill="${b}"/>`,
    sash:`<rect width="40" height="46" fill="${a}"/><path d="M0 8 L8 0 L40 32 L40 42Z" fill="${b}"/>`,
    halves:`<rect width="20" height="46" fill="${a}"/><rect x="20" width="20" height="46" fill="${b}"/>`,
    chevron:`<rect width="40" height="46" fill="${a}"/><path d="M0 4 L20 18 L40 4 L40 12 L20 26 L0 12Z" fill="${b}"/>`}[c.p]||`<rect width="40" height="46" fill="${a}"/><path d="M4 4 H36" stroke="${b}" stroke-width="6"/>`;
  const ab=clubAbbr(k);
  return `<svg viewBox="0 0 40 46" class="crsvg" aria-hidden="true"><defs><clipPath id="${id}"><path d="M3 3 H37 V24 Q37 38 20 44 Q3 38 3 24Z"/></clipPath></defs>
    <g clip-path="url(#${id})">${pat}<rect y="27" width="40" height="11" fill="#0a1712"/></g>
    <text x="20" y="35.6" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="${ab.length>3?7:9}" fill="#fff" letter-spacing=".3">${ab}</text>
    <path d="M3 3 H37 V24 Q37 38 20 44 Q3 38 3 24Z" fill="none" stroke="#0a1712" stroke-width="2.4"/></svg>`}
const crestTag=(k,cls="")=>`<span class="crest ${cls}" title="${esc(CLUBS[k]?CLUBS[k].n:"")}">${crest(k)}</span>`;
/* ---------- química ---------- */
function chemBonus(squad,p){const n=squad.filter(q=>q.c===p.c).length;return n>=3?4:n===2?2:0}
function stats(squad,p){const b=chemBonus(squad,p);return p.s.map(v=>v+b)}

function cardHTML(p,{squad=[],cls="",tag="button",attrs="",swap=false}={}){
  const b=squad.length?chemBonus(squad,p):0,st=p.s.map(v=>v+b),c=CLUBS[p.c];
  const L=["ATA","DEF","TEC","FIS"];
  return `<${tag} class="card ${cls} ${spClass(p)} pos-${p.pos} ${p.ovr<65?"t-b":p.ovr<75?"t-s":"t-g"}" ${attrs} aria-label="${esc(p.n)}, ${esc(c.n)}, media ${p.ovr}"><span class="fno" aria-hidden="true">Nº ${String(hash(p.n+p.c)%900+100)}</span>

function swapDraft(id,used){
  if(S.swaps<=0)return;
  const cand=POOL.filter(p=>!used.has(p.id));
  const nw=cand[rand(cand.length)];
  S.pack=S.pack.map(p=>p.id===id?nw:p);S.swaps--;render();
}

/* ---------- partido ---------- */
function rivalSquad(mine,boost=duelBoost()){
  const myIds=new Set(mine.map(p=>p.id)),target=mine.reduce((a,p)=>a+p.ovr,0)+boost;
  const rest=POOL.filter(p=>!myIds.has(p.id));
  const ok=s=>{const n=s.filter(p=>p.pos==="DEL"||p.pos==="MED").length;return n>=2&&n<=4};
  const sum=s=>s.reduce((a,p)=>a+p.ovr,0);
  let best=null,bd=1e9;
  /* arranca de un quinteto al azar y lo va acercando a la media objetivo cambiando de a una carta */
  for(let t=0;t<40&&bd>2;t++){
    let s=shuffle(rest).slice(0,5);if(!ok(s))continue;
    for(let it=0;it<60;it++){
      const d=Math.abs(sum(s)-target);if(d<bd){bd=d;best=s.slice()}if(d<=2)break;
      const c=rest[rand(rest.length)];if(s.includes(c))continue;
      const n=s.slice();n[rand(5)]=c;if(ok(n)&&Math.abs(sum(n)-target)<d)s=n;
    }
  }
  return best||shuffle(rest).slice(0,5);
}
function startMatch(mine,rival){
  S={phase:"match",me:mine.slice(),cpu:rival||rivalSquad(mine),usedMe:[],usedCpu:[],round:1,gMe:0,gCpu:0,
     step:"choose",sel:null,play:null,cpuPick:null,result:null,log:[],dots:[],swap:0,swapMode:false,lvl:duelLvl()};
  S.rivalName=(CLUBS[S.cpu[0].c].n.split(" ")[0])+" y cía.";
  if(attacker()==="cpu")cpuAttack();
  render();
}
const attacker=()=>S.round%2===1?"me":"cpu";
const left=(arr,used)=>arr.filter(p=>!used.includes(p.id));
function attVal(st,pl){return st[PLAYS.find(x=>x.k===pl).att]}
function defVal(st,pl){return PLAYS.find(x=>x.k===pl).def(st)}

function cpuAttack(){
  const hand=left(S.cpu,S.usedCpu),defLeft=[2,4].filter(r=>r>S.round).length; // defensas de la compu restantes: rondas impares futuras
  const myAttacksLeft=[1,3,5].filter(r=>r>S.round).length;
  let opts=[];
  hand.forEach(p=>{const st=stats(S.cpu,p);PLAYS.forEach(pl=>{
    const a=attVal(st,pl.k),d=st[1];
    opts.push({p,pl:pl.k,score:a-(myAttacksLeft>0?0.35*d:0)+Math.random()*4});
  })});
  opts.sort((x,y)=>y.score-x.score);
  S.cpuPick=opts[0].p;S.play=opts[0].pl;S.step="choose";
}
function cpuDefend(pl){
  const hand=left(S.cpu,S.usedCpu),cpuAttacksLeft=[2,4].filter(r=>r>S.round).length;
  let best=null,bs=-1e9;
  hand.forEach(p=>{const st=stats(S.cpu,p);
    const att=Math.max(st[0],st[2],st[3]);
    const s=defVal(st,pl)-(cpuAttacksLeft>0?0.45*att:0)+Math.random()*5;
    if(s>bs){bs=s;best=p}});
  return best;
}
function resolve(){
  const myCard=S.sel,cpuCard=S.cpuPick,pl=S.play,meAtt=attacker()==="me";
  const att=meAtt?attVal(stats(S.me,myCard),pl):attVal(stats(S.cpu,cpuCard),pl);
  const def=meAtt?defVal(stats(S.cpu,cpuCard),pl):defVal(stats(S.me,myCard),pl);
  const goal=att>def,tie=att===def;
  if(goal){meAtt?S.gMe++:S.gCpu++}
  S.usedMe.push(myCard.id);S.usedCpu.push(cpuCard.id);
  S.result={att,def,goal,tie,meAtt};
  const plName=PLAYS.find(x=>x.k===pl).name;
  const a=meAtt?myCard:cpuCard,d=meAtt?cpuCard:myCard;
  S.log.push(`<span>${S.round}' · <b>${esc(shortName(a.n))}</b> intenta ${plName.toLowerCase()} (${att}) contra <b>${esc(shortName(d.n))}</b> (${def}) → ${goal?(meAtt?"<b>¡gol tuyo!</b>":"<b>gol rival</b>"):tie?"¡palo!":"la para"}</span>`);
  S.dots.push(goal?(meAtt?"gm":"gc"):"s");
  S.step="reveal";
}
function nextRound(){
  if(S.round===5){finish();return}
  S.round++;S.sel=null;S.play=null;S.cpuPick=null;S.result=null;S.step="choose";S.swapMode=false;
  if(attacker()==="cpu")cpuAttack();
  render();
}
function finish(){
  const r=S.gMe>S.gCpu?"w":S.gMe<S.gCpu?"l":"d";
  REC[r]++;
  S.prevSt=REC.st;
  if(r==="w"){REC.st++;S.newBest=REC.st>REC.best;REC.best=Math.max(REC.best,REC.st)}
  else if(r==="l")REC.st=0;
  saveRec();
  S.step="end";S.final=r;render();
}
function doSwap(id){
  const taken=new Set([...S.me,...S.cpu].map(p=>p.id));
  const cand=POOL.filter(p=>!taken.has(p.id));
  const nw=cand[rand(cand.length)];
  S.me=S.me.map(p=>p.id===id?nw:p);S.swap=0;S.swapMode=false;
  if(S.sel&&S.sel.id===id)S.sel=null;
  render();
}

/* papelitos para festejar (CSS puro, se apagan con reduced-motion) */
function confetti(n=26){
  const cols=["#ffb627","#f3f1e7","#5cc8ff","#ff5a43","#c6ff4a"];
  return `<div class="confetti" aria-hidden="true">${Array.from({length:n},(_,i)=>`<i style="--x:${(Math.random()*100).toFixed(1)}%;--d:${(Math.random()*.5).toFixed(2)}s;--r:${rand(360)}deg;--dx:${rand(80)-40}px;background:${cols[i%cols.length]}"></i>`).join("")}</div>`;
}
function renderMatch(){
  const meAtt=attacker()==="me";
  const dots=[1,2,3,4,5].map(i=>`<span class="${S.dots[i-1]||""} ${i===S.round&&S.step!=="end"?"now":""}"></span>`).join("");
  let center="";
  const plName=S.play?PLAYS.find(x=>x.k===S.play).name:"";

  if(S.step==="end"){
    const t=S.final==="w"?"¡Ganaste!":S.final==="l"?"Perdiste":"Empate";
    const streak=S.final==="w"
      ?`<div class="streak up"><b>Racha ${REC.st}</b>${S.newBest&&REC.st>1?"<em>¡Nuevo récord de racha!</em>":""}<span>El próximo rival viene nivel ${duelLvl()}: más media en su quinteto.</span></div>`
      :!S.prevSt
      ?`<div class="streak"><b>Nivel 1</b><span>Ganá un partido para arrancar la racha.${REC.best?` Tu mejor racha: ${REC.best}.`:""}</span></div>`
      :S.final==="l"
      ?`<div class="streak down"><b>Racha cortada en ${S.prevSt}</b><span>Volvés a nivel 1. Tu mejor racha: ${REC.best}.</span></div>`
      :`<div class="streak"><b>Racha ${REC.st}</b><span>El empate no la corta. Seguís en nivel ${duelLvl()}.</span></div>`;
    center=`<div class="verdict ${S.final==="w"?"me":S.final==="l"?"cpu":"s"}">${t}</div>
      <p class="call">${S.gMe} a ${S.gCpu}<small>${S.final==="w"?"Vuelta olímpica en el living.":S.final==="l"?"Hay que revisar ese quinteto.":"Reparto de puntos."}</small></p>
      ${streak}
      <div class="ctrl"><button class="btn" id="rematch">${S.final==="w"?"Seguir con este equipo":"Revancha con el mismo equipo"}</button><button class="btn ghost" id="newpack">Abrir otro sobre</button></div>
      ${S.final==="w"?confetti():""}`;
  } else if(S.step==="reveal"){
    const R=S.result;
    const tagC=(html,who)=>`<div class="dc ${who}"><span class="who">${who==="me"?"Vos":"Rival"}</span>${html}</div>`;
    const myC=tagC(cardHTML(S.sel,{squad:S.me,tag:"div"}),"me"),cpuC=tagC(cardHTML(S.cpuPick,{squad:S.cpu,tag:"div"}),"cpu");
    const good=R.goal===R.meAtt; /* el resultado te favorece */
    const vt=R.goal?(R.meAtt?"¡GOOOL!":"Gol del rival"):R.tie?"¡PALO!":R.meAtt?"¡La para!":"¡La paraste!";
    const winSide=R.goal?(R.meAtt?"me":"cpu"):(R.meAtt?"cpu":"me");
    center=`<div class="verdict ${R.goal?(R.meAtt?"me":"cpu"):"s"}">${vt}</div>
      <div class="duel ${good?"good":"bad"} win-${winSide}">${R.meAtt?myC:cpuC}<div class="vs"><span class="n ${R.meAtt?"me":"cpu"}">${R.att}</span><small>${plName}</small>vs<br><span class="n ${R.meAtt?"cpu":"me"}">${R.def}</span><small>marca</small></div>${R.meAtt?cpuC:myC}</div>
      ${R.goal&&R.meAtt?confetti():""}
      <div class="ctrl"><button class="btn" id="next">${S.round===5?"Ver resultado":"Siguiente jugada"}</button></div>`;
  } else if(meAtt){
    if(!S.sel){
      center=`<p class="call">Atacás vos${S.swapMode?"":""}<small>${S.swapMode?"Tocá la carta de tu mano que querés cambiar.":"Elegí una carta de tu mano para armar la jugada."}</small></p>`;
    } else {
      const st=stats(S.me,S.sel);
      center=`<p class="call">¿Qué intenta ${esc(shortName(S.sel.n))}?<small>La compu ve la jugada pero no tu carta, y elige con quién marcar.</small></p>
        <div class="plays">${PLAYS.map(pl=>`<button class="play" data-play="${pl.k}"><em>${st[pl.att]}</em><b>${pl.name}</b><span>${pl.hint}</span></button>`).join("")}</div>`;
    }
  } else {
    const pl=PLAYS.find(x=>x.k===S.play);
    center=`<p class="call">Ataca el rival: <span style="color:var(--acc)">${pl.name}</span><small>${S.swapMode?"Tocá la carta de tu mano que querés cambiar.":`Elegí quién marca. Se compara ${pl.hint}.`}</small></p>`;
  }

  const handMe=S.me.map(p=>{
    const used=S.usedMe.includes(p.id),sel=S.sel&&S.sel.id===p.id;
    let extra="",mk="";
    if(!used&&S.step==="choose"&&!meAtt&&!S.swapMode){const v=defVal(stats(S.me,p),S.play);extra=` · marca ${v}`;mk=`<span class="mk" aria-hidden="true">Marca <b>${v}</b></span>`}
    return `<div class="hw">${cardHTML(p,{squad:S.me,cls:(used?"used ":"")+(sel?"sel ":""),attrs:`data-id="${p.id}" ${used||S.step!=="choose"?"disabled":""} title="${esc(p.n)}${extra}"`})}${mk}</div>`;
  }).join("");
  const handCpu=S.cpu.map(p=>`<div class="back ${S.usedCpu.includes(p.id)?"used":""}" aria-hidden="true">?</div>`).join("");

  app.innerHTML=header()+`
  <div class="board">
    <div class="team">Vos</div><div class="score ${S.step==="reveal"&&S.result&&S.result.goal?"bump":""}">${S.gMe} – ${S.gCpu}</div><div class="team r">${esc(S.rivalName)}<small>Nivel ${S.lvl||1}</small></div>
    <div class="meta"><span>Jugada ${Math.min(S.round,5)}/5</span><span class="dots" aria-label="jugadas">${dots}</span><span>${S.step==="end"?"Final":meAtt?"Atacás vos":"Defendés"}</span></div>
  </div>
  <div class="hand" aria-label="mano del rival">${handCpu}</div>
  <section class="field">${center}</section>
  <section class="panel">
    <div class="row-head"><div class="label">Tu mano${!meAtt&&S.step==="choose"&&!S.swapMode?" · tocá quién marca":meAtt&&S.step==="choose"&&!S.sel&&!S.swapMode?" · tocá quién ataca":""}</div>
      ${S.step==="choose"&&S.swap?`<button class="btn ghost" id="swapbtn">${S.swapMode?"Cancelar swap":"↻ Swap (1)"}</button>`:""}</div>
    <div class="hand">${handMe}</div>
  </section>
  ${S.log.length?`<section class="panel"><div class="label" style="margin-bottom:8px">Relato</div><div class="log">${S.log.join("")}</div></section>`:""}`;

  app.querySelectorAll(".hand .card[data-id]").forEach(el=>el.addEventListener("click",()=>{
    const p=S.me.find(x=>x.id===+el.dataset.id);
    if(S.swapMode){doSwap(p.id);return}
    if(meAtt){S.sel=p;render()}
    else{S.sel=p;resolve();render()}
  }));
  app.querySelectorAll("[data-play]").forEach(el=>el.addEventListener("click",()=>{
    S.play=el.dataset.play;S.cpuPick=cpuDefend(S.play);resolve();render();
  }));
  const q=id=>document.getElementById(id);
  if(q("next"))q("next").onclick=nextRound;
  if(q("swapbtn"))q("swapbtn").onclick=()=>{S.swapMode=!S.swapMode;S.sel=null;render()};
  if(q("rematch"))q("rematch").onclick=()=>{const mine=S.me;startMatch(mine)};
  if(q("newpack"))q("newpack").onclick=newDraft;
}

function wpick(arr,n,wf){
  const pool=arr.slice(),out=[];
  while(out.length<n&&pool.length){
    let tot=0;const w=pool.map(p=>{const x=Math.max(.01,wf(p));tot+=x;return x});
    let r=Math.random()*tot,i=0;while(r>w[i]&&i<w.length-1){r-=w[i];i++}
    out.push(pool[i]);pool.splice(i,1);
  }
  return out;
}

const linkPts=avg=>avg>=1.5?7:avg>=1?6:avg>=.5?4:avg>0?2:0;
function chemFor(form,s,cap,dt){
  const L=LINKS[form];
  const links=L.map(([a,b])=>[a,b,linkVal(s[a],s[b])]);
  const pl=s.map((p,i)=>{
    if(!p)return 0;
    const mine=links.filter(l=>(l[0]===i||l[1]===i)&&l[2]>=0);
    const avg=mine.length?mine.reduce((a,l)=>a+l[2],0)/mine.length:1;
    return Math.min(10,3+linkPts(avg)+(cap!=null&&cap===p.id?1:0)+(dt&&p.nat===dt?1:0));
  });
  return {pl,links,team:Math.min(100,pl.reduce((a,b)=>a+b,0))};
}
function dtSel(cur,xi){const cnt={};xi.filter(Boolean).forEach(p=>{if(p.nat)cnt[p.nat]=(cnt[p.nat]||0)+1});
  return `<label class="dtsel"><span>DT (+1 de química a los jugadores de su país)</span><select class="inp" id="dtsel"><option value="">Sin DT</option>${Object.keys(NATN).sort((a,b)=>(cnt[b]||0)-(cnt[a]||0)).map(k=>`<option value="${k}" ${cur===k?"selected":""}>DT de ${NATN[k]}${cnt[k]?` · ${cnt[k]} en tu once`:""}</option>`).join("")}</select></label>`}
function fdStats(){
  const xi=FD.slots.filter(Boolean),ch=fdChem();

}
/* rivales: mejor once de cada club */
let CLUBXI=null;
function buildClubXI(){
  if(CLUBXI)return CLUBXI;
  const by={};CMPOOL.forEach(p=>{(by[p.c]=by[p.c]||[]).push(p)});
  CLUBXI=Object.keys(by).map(c=>{
    const ps=by[c],take=(pos,n)=>ps.filter(p=>p.pos===pos).sort((a,b)=>b.ovr-a.ovr).slice(0,n);
    const xi=[...take("ARQ",1),...take("DEF",4),...take("MED",3),...take("DEL",3)];
    if(xi.length<11)return null;
    const avg=xi.reduce((a,p)=>a+p.ovr,0)/11;
    return {c,n:CLUBS[c].n,lg:CLUBS[c].lg,xi,avg:Math.round(avg),str:avg+3};
  }).filter(Boolean).sort((a,b)=>a.str-b.str);
  return CLUBXI;
}
function fdRivals(){
  const L=buildClubXI(),N=L.length,band=(lo,hi)=>L.slice(Math.floor(N*lo),Math.max(Math.floor(N*lo)+1,Math.floor(N*hi)));
  const picks=[],seen=new Set();
  [[.3,.6],[.55,.8],[.75,.92],[.9,1]].forEach(([lo,hi])=>{
    let b=band(lo,hi).filter(r=>!seen.has(r.c));const r=b[rand(b.length)]||L[N-1];seen.add(r.c);picks.push(r);
  });

}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function scorer(xi){
  const att=xi.filter(p=>p.pos!=="ARQ");
  return wpick(att,1,p=>Math.pow(p.s[0],3)*(p.pos==="DEL"?3:p.pos==="MED"?1.3:.35))[0];
}

function fdPlay(){
  const rv=FD.rivals[FD.round],mine=FD.slots,mc=fdChem().pl;
  const sim=simMatch(mine,mc,rv);
  const gm=sim.ev.filter(e=>e.type==="goal"&&e.me).length,gr=sim.ev.filter(e=>e.type==="goal"&&!e.me).length;
  let pens=null,win=gm>gr,kicks=null;
  let needPens=gm===gr&&!(FD.club&&FD.kind==="amistoso");const lfx=FD.lib?FD.lib.cur:null;
  if(lfx){if(lfx.ph==="g"||lfx.leg===1)needPens=false;else if(lfx.leg===2){const a=lfx.first.gm+gm,b=lfx.first.gr+gr;needPens=a===b;win=a>b}}
  if(needPens){
    const cl=v=>Math.max(.62,Math.min(.86,v));
    const pa=cl(.74+(sim.A.att-sim.B.gk)*.003),pb=cl(.74+(sim.B.att-sim.A.gk)*.003);
    const sh=mine.filter(p=>p.pos!=="ARQ").sort((x,y)=>y.s[0]-x.s[0]),rs=rv.xi.filter(p=>p.pos!=="ARQ").sort((x,y)=>y.s[0]-x.s[0]);
    kicks=[];let k=0;
    while(true){
      kicks.push({me:true,ok:Math.random()<pa,p:sh[k%sh.length]});kicks.push({me:false,ok:Math.random()<pb,p:rs[k%rs.length]});k++;
      const A=kicks.filter(x=>x.me&&x.ok).length,B=kicks.filter(x=>!x.me&&x.ok).length;
      if(k>=5&&A!==B)break;
      if(k>=12){kicks[kicks.length-2].ok=true;kicks[kicks.length-1].ok=false;break}
    }
    pens=[kicks.filter(x=>x.me&&x.ok).length,kicks.filter(x=>!x.me&&x.ok).length];win=pens[0]>pens[1];
  }
  const myGK=gkOf(mine),rvGK=gkOf(rv.xi);
  const tl=sim.ev.map(e=>Object.assign(e,{txt:evText(e,rv.n,e.me?rvGK:myGK)}));
  tl.push({m:45,type:"ht",txt:"Final del primer tiempo."},{m:90,type:"ft",txt:"¡Final del partido!"});
  const ord={ht:1,ft:2};tl.sort((a,b)=>a.m-b.m||(ord[a.type]||0)-(ord[b.type]||0));
  const cnt=(f)=>[tl.filter(e=>e.me&&f(e)).length,tl.filter(e=>e.me===false&&f(e)).length];
  const shot=e=>["goal","save","miss","post"].includes(e.type);
  const stats={poss:[sim.poss,100-sim.poss],shots:cnt(shot),ot:cnt(e=>e.type==="goal"||e.type==="save"),
    xg:[tl.filter(e=>e.me&&shot(e)).reduce((a,e)=>a+e.xg,0),tl.filter(e=>e.me===false&&shot(e)).reduce((a,e)=>a+e.xg,0)],
    yc:cnt(e=>e.type==="yellow"),rc:cnt(e=>e.type==="red")};
  FD.last={gm,gr,ev:tl.filter(e=>e.type==="goal"),pens,win,rv,kicks,tl,stats};
  FD.log.push({stage:stg()[FD.round],rv:rv.n,gm,gr,pens,win});
  FD.step="live";
  if(FD.lib)libRecord(FD.last);
  if(FD.club){clubAfterMatch()}else{
  if(FD.lib?FD.lib.champ:(win&&FD.round===3)){FDREC.cups++}
  if(win)FDREC.wins++;
  saveFD();
  checkMatchAch();}
}
/* ---------- motor de partido por líneas ---------- */
const chemK=c=>.88+c*.017;
function lineR(xi,chem){
  const att=[],mid=[],def=[];let gk=60,nD=0,nM=0,nA=0;
  const SP=(typeof FD!=="undefined"&&FD&&FD.form&&xi===FD.slots)?FORMS[FD.form].map(x=>x[0]):null;
  xi.forEach((p,i)=>{const s=p.s.map(v=>v*chemK(chem[i])),P=SP?SP[i]:p.pos;
    if(P==="DEL"){nA++;att.push([s[0]*.55+s[2]*.25+s[3]*.2,1])}
    else if(P==="MED"){nM++;mid.push(s[2]*.45+s[1]*.3+s[3]*.25);att.push([s[0]*.5+s[2]*.5,.45])}
    else if(P==="DEF"){nD++;def.push(s[1]*.7+s[3]*.3)}
    else gk=s[1]});
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:55;
  const wa=att.reduce((a,x)=>a+x[0]*x[1],0)/Math.max(.1,att.reduce((a,x)=>a+x[1],0));
  return {att:wa*(1+(nA-2)*.03),mid:av(mid)*(1+(nM-4)*.03),def:(av(def)*.75+gk*.25)*(1+(nD-4)*.03),gk};
}
function assister(xi,sc){return wpick(xi.filter(p=>p!==sc&&p.pos!=="ARQ"),1,p=>Math.pow(p.s[2],2)*(p.pos==="MED"?2:p.pos==="DEL"?1.4:.5))[0]}
function simMatch(mine,mc,rv){
  const A=lineR(mine,mc),B=lineR(rv.xi,rv.xi.map(()=>(FD&&FD.rchem)||7));
  if(FD&&FD.club&&FD.rtac){const rt=FD.rtac[FD.round];applyTac(A,FD.tac,rt);applyTac(B,rt,FD.tac)}
  if(FD&&FD.lib&&FD.lib.cur&&FD.lib.cur.home!=null){const Hm=FD.lib.cur.home?A:B;Hm.att*=1.04;Hm.mid*=1.02}
  const ex=(X,Y)=>Math.max(.2,Math.min(3.6,1.3*Math.pow(X.att/Y.def,3.2)*Math.pow(X.mid/Y.mid,.9)));
  const xgA=ex(A,B),xgB=ex(B,A);
  const poss=Math.round(Math.max(30,Math.min(70,50+(A.mid-B.mid)*1.3+(Math.random()*6-3))));
  const red=[Math.random()<.05?20+rand(68):null,Math.random()<.05?20+rand(68):null];
  const ev=[];
  const mk=side=>{
    const xg=side?xgA:xgB,xi=side?mine:rv.xi,opp=side?B:A,mr=red[side?0:1],orr=red[side?1:0];
    const n=Math.max(4,Math.round(xg/.105*(.8+Math.random()*.45)));
    for(let i=0;i<n;i++){
      const m=1+rand(90);
      if(mr!==null&&m>mr&&Math.random()<.35)continue;
      let q=Math.min(.75,Math.max(.02,-Math.log(1-Math.random()*.999)*xg/n));
      if(orr!==null&&m>orr)q=Math.min(.8,q*1.3);
      const qq=Math.max(.01,q*(1+(65-opp.gk)/120));
      const p=scorer(xi),r=Math.random();
      if(r<qq)ev.push({m,type:"goal",me:side,p,as:Math.random()<.72?assister(xi,p):null,xg:q});
      else if(r<qq+.3)ev.push({m,type:"save",me:side,p,xg:q});
      else if(Math.random()<.08)ev.push({m,type:"post",me:side,p,xg:q});
      else ev.push({m,type:"miss",me:side,p,xg:q});
    }};
  mk(true);mk(false);
  [true,false].forEach(side=>{const xi=side?mine:rv.xi,n=poisson(1.7);
    for(let i=0;i<n;i++)ev.push({m:1+rand(90),type:"yellow",me:side,p:wpick(xi.filter(x=>x.pos!=="ARQ"),1,x=>x.pos==="DEF"?3:x.pos==="MED"?2:1)[0]})});
  red.forEach((m,i)=>{if(m!==null){const xi=i===0?mine:rv.xi;ev.push({m,type:"red",me:i===0,p:wpick(xi.filter(x=>x.pos!=="ARQ"),1,x=>x.pos==="DEF"?3:1)[0]})}});
  if(FD&&FD.bench&&mine===FD.slots)fdSubs(ev,mine);
  ev.sort((a,b)=>a.m-b.m);
  return {ev,poss,A,B,xgA,xgB};
}
/* hasta 3 cambios entre el 55' y el 85': entra un suplente por un titular del mismo puesto */
function fdSubs(ev,mine){
  const F=FORMS[FD.form],bench=FD.bench.filter(p=>p&&p.pos!=="ARQ");if(!bench.length)return;
  const red=new Set(ev.filter(e=>e.me&&e.type==="red").map(e=>e.p)),outs=new Set(),ins=new Set();
  [55+rand(10),66+rand(9),76+rand(9)].forEach(m=>{
    const pairs=[];mine.forEach((s,i)=>{if(!s||F[i][0]==="ARQ"||outs.has(s)||red.has(s)||s.id===FD.cap)return;
      bench.forEach(b=>{if(!ins.has(b)&&b.pos===F[i][0])pairs.push([s,b])})});
    const pr=wpick(pairs,1,([s,b])=>Math.pow(Math.max(1,b.ovr-s.ovr+15),1.5)+(s.pos!==F[mine.indexOf(s)][0]?400:0))[0];if(!pr)return;
    const [off,inn]=pr;ins.add(inn);outs.add(off);
    ev.forEach(e=>{if(e.me&&e.m>m){if(e.p===off)e.p=inn;if(e.as===off)e.as=inn}});
    ev.push({m,type:"sub",me:true,p:inn,off,xg:0});
  });
}
function evText(e,rvn,gk){
  const n=shortName(e.p.n),g=shortName(gk.n),side=e.me?"tu equipo":rvn;
  if(e.type==="goal")return pickT([`¡GOOOL de ${n}! La clavó al ángulo.`,`¡Gol! ${n} definió cruzado, abajo.`,`¡Adentro! ${n} ganó de cabeza en el área.`,`¡Gol de ${n}! Se la picó al arquero.`,`¡Golazo de ${n} desde afuera del área!`,`¡Gol de ${n}! Empujó la pelota en el segundo palo.`])+(e.as?` Asistencia de ${shortName(e.as.n)}.`:"");
  if(e.type==="save")return pickT([`¡Qué atajada de ${g}! Le sacó el remate a ${n}.`,`${n} probó de lejos y ${g} la mandó al córner.`,`Mano a mano de ${n}… ¡y ${g} se queda con la pelota!`,`Cabezazo de ${n}, a las manos de ${g}.`]);
  if(e.type==="post")return `¡Palo de ${n}! Se salvó ${e.me?rvn:"tu equipo"}.`;
  if(e.type==="miss")return pickT([`${n} la tiró por arriba del travesaño.`,`¡Uy! ${n} la tiró apenas desviada.`,`${n} quedó solo, pero le pegó mordido.`,`Remate de ${n} que se va lejos.`]);
  if(e.type==="yellow")return `Amarilla para ${n} (${side}).`;
  if(e.type==="red")return `¡Roja directa para ${n}! ${e.me?"Tu equipo":rvn} se queda con diez.`;
  if(e.type==="sub")return `Cambio en tu equipo: entra ${n} por ${shortName(e.off.n)}.`;
  return "";
}
function statsHTML(s,cls){
  const rows=[["Posesión",s.poss,v=>v+"%"],["Remates",s.shots],["Al arco",s.ot],["Goles esperados",s.xg,v=>v.toFixed(1)],["Amarillas",s.yc],["Rojas",s.rc]];
  return `<div class="mstats ${cls||""}">${rows.map(([l,[a,b],f])=>{f=f||(v=>v);const t=(a+b)||1;

function renderLive(){
  const L=FD.last;
  app.innerHTML=header()+`<section class="board"><div class="team">Tu once</div><div class="score" id="lsc">0 – 0</div><div class="team r">${esc(L.rv.n)}</div>
   <div class="meta"><span>${stg()[FD.round]}</span><span id="lclock">0'</span></div></section>
   <div class="lbar"><i id="lbar"></i></div>
   <div class="ctrl"><button class="btn ghost sm" id="fast">Más rápido</button><button class="btn ghost sm" id="skip">Saltar al final</button></div>
   <div class="fdgrid"><section class="panel"><p class="label">Relato en vivo</p><div class="feed" id="feed" aria-live="polite"></div></section>
   <section class="panel"><p class="label">Estadísticas</p><div id="lstats"></div></section></div>`;
  let min=0,idx=0,speed=1,pk=0,a=0,b=0,ga=0,gb=0;
  const st={poss:[50,50],shots:[0,0],ot:[0,0],xg:[0,0],yc:[0,0],rc:[0,0]};
  const feed=document.getElementById("feed"),$=id=>document.getElementById(id);
  const add=(cls,m,txt)=>{const d=document.createElement("div");d.className="fi "+cls;d.innerHTML=`<span>${m}</span><p>${esc(txt)}</p>`;feed.prepend(d)};
  const done=()=>{clearTimeout(LIVE_T);FD.step="result";render();window.scrollTo(0,0)};
  const cls=e=>e.type==="goal"?(e.me?"g me":"g rv"):e.type==="yellow"?"yc":e.type==="red"?"rc":e.type==="post"?"miss":e.type;
  const tick=()=>{
    if(!$("lclock"))return;
    if(min<90){min++;
      while(idx<L.tl.length&&L.tl[idx].m<=min){const e=L.tl[idx++],s=e.me?0:1;
        if(e.type==="goal"){if(e.me)ga++;else gb++;}
        if(["goal","save","miss","post"].includes(e.type)){st.shots[s]++;st.xg[s]+=e.xg;if(e.type!=="miss"&&e.type!=="post")st.ot[s]++}
        if(e.type==="yellow")st.yc[s]++;if(e.type==="red")st.rc[s]++;
        add(cls(e),e.type==="ht"||e.type==="ft"?"":e.m+"'",e.txt)}
      const pw=Math.round(50+(L.stats.poss[0]-50)*Math.min(1,min/25));st.poss=[pw,100-pw];
      $("lclock").textContent=min+"'";$("lsc").textContent=ga+" – "+gb;$("lbar").style.width=(min/90*100)+"%";$("lstats").innerHTML=statsHTML(st);
      LIVE_T=setTimeout(tick,(min===45?900:110)/speed);return;}
    if(L.kicks&&pk<L.kicks.length){
      if(pk===0)add("ht","",FD.lib&&FD.lib.cur&&FD.lib.cur.leg===2?"Global empatado. Se define por penales.":"Empate. Se define por penales.");
      const k=L.kicks[pk++];if(k.ok){if(k.me)a++;else b++}
      add(k.ok?(k.me?"g me":"g rv"):"save","PEN",`${shortName(k.p.n)} (${k.me?"vos":L.rv.n}) ${k.ok?"¡lo metió!":"¡lo erró!"}`);
      $("lsc").textContent=`${ga} – ${gb} (${a}-${b})`;
      LIVE_T=setTimeout(tick,750/speed);return;}
    LIVE_T=setTimeout(done,1400/speed);
  };
  $("fast").onclick=e=>{speed=speed===1?4:1;e.currentTarget.textContent=speed===1?"Más rápido":"Velocidad normal"};
  $("skip").onclick=()=>done();
  $("lstats").innerHTML=statsHTML(st);
  LIVE_T=setTimeout(tick,500);
}

function rr(x,l,t,w,h,r){x.beginPath();if(x.roundRect)x.roundRect(l,t,w,h,r);else x.rect(l,t,w,h)}
function svgImg(svg){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" '))})}
function fdOutcome(){
  if(!FD.log.length)return "Mi once";
  if(FD.lib)return FD.lib.champ?"¡Campeón de América!":!FD.lib.alive?"Eliminado en "+FD.lib.outAt:FD.lib.phase==="g"?"Jugando el Grupo "+FD.lib.letter:"Jugando "+KOST[FD.lib.ko[FD.lib.ko.length-1].st][0].toLowerCase();
  if(FD.kind==="amistoso"){const r=FD.log[0];return r.win?"Victoria en amistoso":r.gm===r.gr?"Empate en amistoso":"Derrota en amistoso"}
  const r=FD.log[FD.log.length-1];
  if(!r.win)return "Eliminado en "+stg()[FD.log.length-1].toLowerCase();
  if(FD.log.length===stg().length&&stg().length>1)return "¡Campeón de América!";
  return "Pasé "+stg()[FD.log.length-1].toLowerCase();
}

/* ================= MI CLUB (Conmebol) ================= */
const CLKEY="cabezones-club";
let CLS=null,CL={view:"hub"},CL_T=null,CLQ_T=null;
const NATN={ARG:"Argentina",BRA:"Brasil",CHI:"Chile",COL:"Colombia",ECU:"Ecuador",PAR:"Paraguay",PER:"Perú",URU:"Uruguay",VEN:"Venezuela",BOL:"Bolivia"};
const fmt=n=>Math.round(n).toLocaleString("es-AR");
const nrm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const PKEY=new Map();
CMPOOL.forEach(p=>PKEY.set(p.n+"|"+p.c,p));LEG.forEach(p=>PKEY.set("L|"+p.n,p));
const keyOf=p=>p.sp==="leyenda"?"L|"+p.n:p.n+"|"+p.c;
function clLoad(){
  try{CLS=JSON.parse(localStorage.getItem(CLKEY)||"null")}catch(e){CLS=null}
  if(!CLS||!CLS.v)CLS={v:1,coins:5000,next:1,cards:[],owned:{bien:1},squad:{form:"4-3-3",slots:Array(11).fill(null)},sbc:{},daily:null,stats:{w:0,d:0,l:0,cups:0,packs:0}};
  if(!CLS.div)CLS.div={d:10,s:{p:0,pts:0,w:0,dr:0,l:0},best:10};
  if(!CLS.en)CLS.en={v:EN_MAX,t:Date.now()};
}
/* ---------- energía ---------- */
const EN_MAX=5,EN_MS=30*60*1000;
function enGet(){const e=CLS.en,now=Date.now();if(e.v>=EN_MAX){e.t=now;return e.v}const g=Math.floor((now-e.t)/EN_MS);if(g>0){e.v=Math.min(EN_MAX,e.v+g);e.t=e.v>=EN_MAX?now:e.t+g*EN_MS;clSave()}return e.v}
function enUse(){enGet();if(CLS.en.v<1)return false;if(CLS.en.v>=EN_MAX)CLS.en.t=Date.now();CLS.en.v--;clSave();return true}
function enNext(){if(enGet()>=EN_MAX)return "";const ms=Math.max(0,CLS.en.t+EN_MS-Date.now()),m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return `${m}:${String(s).padStart(2,"0")}`}
/* ---------- divisiones ---------- */
const divBand=d=>{const lo=(10-d)*.095;return [lo,Math.min(1,lo+.12)]};
const divRChem=d=>6+(10-d)*.4;
const divWin=d=>250+(10-d)*50;
function seasonEnd(){
  const d=CLS.div.d,s=CLS.div.s;let coins=1000+(10-d)*700,msg,nd=d;const packs=[];
  if(d<=4)packs.push("pla");if(d<=2)packs.push("oro");
  if(s.pts>=13&&d>1){nd=d-1;coins+=1000;msg=`¡Ascendiste a División ${nd}!`}
  else if(s.pts>=13){msg="¡Campeón de División 1!";packs.push("ley")}
  else if(s.pts>=8||d===10)msg=`Te mantenés en División ${d}.`;
  else{nd=d+1;msg=`Descendiste a División ${nd}.`}
  CLS.coins+=coins;packs.forEach(k=>CLS.owned[k]=(CLS.owned[k]||0)+1);
  CLS.div={d:nd,s:{p:0,pts:0,w:0,dr:0,l:0},best:Math.min(CLS.div.best||10,nd)};
  return `${msg} Premio de temporada: ${fmt(coins)} monedas${packs.length?" y "+packs.map(k=>PACKN[k]).join(", "):""}.`;
}
function clSave(){try{localStorage.setItem(CLKEY,JSON.stringify(CLS))}catch(e){}}
function cardOf(ci){const b=PKEY.get(ci.k);if(!b)return null;const o=Object.assign({},b,{id:"u"+ci.u,u:ci.u});if(ci.f){o.s=b.s.map(v=>Math.min(99,v+ci.f));o.ovr=b.ovr+ci.f;o.sp="forma"}if(ci.t){o.s=o.s.map(v=>Math.min(99,v+ci.t));o.ovr+=ci.t;o.tr=ci.t}return o}
function addCard(p){const ci={u:CLS.next++,k:keyOf(p)};if(p.sp==="forma"){const b=PKEY.get(ci.k);ci.f=p.ovr-b.ovr}CLS.cards.push(ci);return ci}
const clubCards=()=>CLS.cards.map(cardOf).filter(Boolean);
const byU=u=>{const ci=CLS.cards.find(c=>c.u===u);return ci?cardOf(ci):null};
function cardVal(p){
  if(p.sp==="leyenda")return 5000+Math.max(0,p.ovr-85)*400;
  let v=p.ovr<62?40:p.ovr<66?80:p.ovr<70?150:p.ovr<74?320:p.ovr<78?650:p.ovr<80?1100:1800+(p.ovr-80)*450;
  if(p.sp==="forma")v*=2.2;return Math.round(v*.5/10)*10;
}
function removeCard(u){CLS.cards=CLS.cards.filter(c=>c.u!==u);CLS.squad.slots=CLS.squad.slots.map(x=>x===u?null:x)}
function sellCard(u){const p=byU(u);if(!p)return 0;const v=cardVal(p);removeCard(u);CLS.coins+=v;objEvent("sell5");clSave();return v}
const squadPlayers=()=>CLS.squad.slots.map(u=>u?byU(u):null);

/* ---------- sobres ---------- */
const PACKS=[
 {id:"bas",n:"Sobre Básico",price:1500,cnt:5,desc:"5 jugadores de toda Conmebol, casi siempre de nivel bajo.",tier:"b"},
 {id:"pla",n:"Sobre Plus",price:5000,cnt:6,desc:"6 jugadores, uno de 74 o más asegurado.",min:[[74,1]],tier:"s"},
 {id:"oro",n:"Sobre Oro",price:12000,cnt:7,desc:"7 jugadores, un Oro (80+) asegurado.",min:[[80,1]],forma:.05,tier:"g"},
 {id:"ley",n:"Sobre Leyenda",price:40000,cnt:3,desc:"3 jugadores de 81 o más, con 8% de chance de Leyenda.",min:[[81,3]],leg:.08,forma:.08,tier:"l"},
];
const PACKN={bien:"Sobre de bienvenida",bas:"Sobre Básico",pla:"Sobre Plus",oro:"Sobre Oro",ley:"Sobre Leyenda"};
function rollPack(pk){
  const out=[];
  (pk.min||[]).forEach(([o,n])=>{const c=CMPOOL.filter(p=>p.ovr>=o);for(let i=0;i<n;i++)out.push(c[rand(c.length)])});
  while(out.length<pk.cnt)out.push(wpick(CMPOOL,1,p=>pk.tier==="b"?Math.max(.05,Math.pow(Math.max(1,84-p.ovr),1.6)):Math.pow(Math.max(1,p.ovr-50),pk.tier==="s"?.8:1.3))[0]);
  const res=out.map(p=>Math.random()<(pk.forma||.03)?enForma(p):p);
  if(pk.leg?Math.random()<pk.leg:Math.random()<.003)res[0]=LEG[rand(LEG.length)];
  return res;
}
function rollWelcome(){const out=[];[["ARQ",2],["DEF",6],["MED",6],["DEL",4]].forEach(([pos,n])=>{const c=CMPOOL.filter(p=>p.pos===pos&&p.ovr>=62&&p.ovr<=76);for(let i=0;i<n;i++)out.push(c[rand(c.length)])});return out}
function openPack(id){
  const pk=PACKS.find(x=>x.id===id),res=id==="bien"?rollWelcome():rollPack(pk);
  const before=new Set(CLS.cards.map(c=>c.k));
  const items=res.map(p=>{const ci=addCard(p);return {u:ci.u,dup:before.has(ci.k)}});
  CLS.stats.packs++;objEvent("packs2");
  if(id==="bien"&&CLS.squad.slots.every(x=>x===null))autoBuild();
  clSave();
  const it=items.map(x=>Object.assign(x,{p:byU(x.u)})).sort((a,b)=>cardVal(a.p)-cardVal(b.p));
  CL={view:"open",items:it,idx:0,pack:PACKN[id]};render();window.scrollTo(0,0);
}
function autoBuild(){
  const F=FORMS[CLS.squad.form],cs=clubCards().sort((a,b)=>b.ovr-a.ovr),used=new Set(),names=new Set();
  CLS.squad.slots=F.map(s=>{const p=cs.find(c=>c.pos===s[0]&&!used.has(c.u)&&!names.has(c.n));if(!p)return null;used.add(p.u);names.add(p.n);return p.u});
}

const SVKEYS=["cabezones-club","cabezones-fd","cabezones-ach","cabezones-rec","cabezones-royale"];
const b64e=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
const b64d=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function zip(u,dir){const S=dir?CompressionStream:DecompressionStream;const st=new Blob([u]).stream().pipeThrough(new S("deflate-raw"));return new Uint8Array(await new Response(st).arrayBuffer())}
async function saveExport(){const d={};SVKEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v)d[k]=JSON.parse(v)}catch(e){}});
  const raw=new TextEncoder().encode(JSON.stringify(d));
  if(typeof CompressionStream!=="undefined"){try{return "CDP1."+b64e(await zip(raw,true))}catch(e){}}
  return "CDP0."+b64e(raw)}
async function saveImport(code){code=(code||"").trim().replace(/\s+/g,"");const m=code.match(/^CDP([01])\.(.+)$/);if(!m)throw new Error("fmt");
  let u=b64d(m[2]);if(m[1]==="1")u=await zip(u,false);const d=JSON.parse(new TextDecoder().decode(u));
  if(!(d["cabezones-club"]&&Array.isArray(d["cabezones-club"].cards))&&!(d["cabezones-royale"]&&d["cabezones-royale"].deck))throw new Error("data");
  SVKEYS.forEach(k=>{try{if(d[k])localStorage.setItem(k,JSON.stringify(d[k]));else localStorage.removeItem(k)}catch(e){}});
  try{const s=d["cabezones-ach"];if(s)ACHS=s}catch(e){}try{if(d["cabezones-fd"])FDREC=d["cabezones-fd"]}catch(e){}try{if(d["cabezones-rec"])REC=d["cabezones-rec"]}catch(e){}
  CLS=null;clLoad();RY=null}

}
function renderSbcList(){

  <div class="sbcl">${SBCS.map(s=>{const done=(CLS.sbc[s.id]&&!s.rep)||doneDay(s);return `<button class="sbc ${done?"done":""} ${s.rw.leg?"legr":""}" data-sbc="${s.id}" ${done?"disabled":""}>
   <i>${s.rep?(doneDay(s)?"Vuelve mañana":"Una vez por día"):done?"Completado":"Formación "+s.form}</i><b>${esc(s.n)}</b>
   <span>${s.req.map(r=>esc(reqCheck(r,Array(11).fill(null),s.form).t)).join(" · ")}</span><em>Premio: ${esc(rwLabel(s.rw))}</em></button>`}).join("")}</div></section>`;
  app.querySelectorAll("[data-sbc]").forEach(b=>b.onclick=()=>{CL={view:"sbc",sbc:{id:b.dataset.sbc,slots:Array(11).fill(null)},f:CL.f};render();window.scrollTo(0,0)});
}
function renderSbc(){
  const s=SBCS.find(x=>x.id===CL.sbc.id),F=FORMS[s.form],sl=CL.sbc.slots.map(u=>u?byU(u):null),ch=chemFor(s.form,sl,null),xi=sl.filter(Boolean);
  const avg=xi.length?Math.round(xi.reduce((a,p)=>a+p.ovr,0)/xi.length):0,rs=reqCheckAll(s,sl),ok=rs.every(r=>r.ok);
  app.innerHTML=clTop()+`<div class="fdgrid"><div>${tiles(avg,ch.team,xi.length)}${clubPitch(s.form,sl,ch,"sb")}</div>
   <section class="panel"><p class="kicker">SBC · ${s.form}</p><h2>${esc(s.n)}</h2>
   <ul class="reqs">${rs.map(r=>`<li class="${r.ok?"ok":""}"><span>${r.ok?"✓":"✗"}</span>${esc(r.t)}<b>${esc(r.c)}</b></li>`).join("")}</ul>
   <p class="sub">Premio: <b>${esc(rwLabel(s.rw))}</b>${s.rw.leg?" (te la llevás al club)":""}</p>
   <div class="ctrl left" style="margin-top:12px"><button class="btn" id="sbcgo" ${ok?"":"disabled"}>Entregar plantilla</button><button class="btn ghost" id="sbcfill">Llenar con las más baratas</button><button class="btn ghost" data-tab="sbcs">Volver</button></div>
   <p class="note">Las cartas de tu once se pueden usar, pero si las entregás quedan fuera del equipo.</p></section></div>`;
  const sq=new Set(CLS.squad.slots.filter(Boolean));
  app.querySelectorAll("[data-sb]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sb,cur=CL.sbc.slots[i];
    openPicker({pos:F[i][0],role:F[i][3],exclude:new Set(CL.sbc.slots.filter((u,j)=>u&&j!==i)),current:cur,mark:sq},u=>{CL.sbc.slots[i]=u;render()})});
  document.getElementById("sbcfill").onclick=()=>{const used=new Set(CL.sbc.slots.filter(Boolean));const cs=clubCards().filter(p=>!sq.has(p.u)).sort((a,b)=>cardVal(a)-cardVal(b));
    CL.sbc.slots=CL.sbc.slots.map((u,i)=>{if(u)return u;const p=cs.find(c=>c.pos===F[i][0]&&!used.has(c.u));if(!p)return null;used.add(p.u);return p.u});render()};
  document.getElementById("sbcgo").onclick=()=>{
    CL.sbc.slots.forEach(u=>removeCard(u));CLS.sbc[s.id]=(CLS.sbc[s.id]||0)+1;if(s.rep==="daily")CLS.sbc[s.id+"@"]=today();objEvent("sbc1");
    if(s.rw.pack){clSave();openPack(s.rw.pack)}
    else{const L=LEG.find(l=>l.n===s.rw.leg);const ci=addCard(L);clSave();CL={view:"open",items:[{u:ci.u,dup:false,p:byU(ci.u)}],idx:0,pack:"Premio SBC"};render();window.scrollTo(0,0)}
  };

function renderPlay(){
  const sl=squadPlayers(),full=sl.every(Boolean),xi=sl.filter(Boolean),ch=chemFor(CLS.squad.form,sl,clCap(),CLS.squad.dt),en=enGet();
  const avg=xi.length?Math.round(xi.reduce((a,p)=>a+p.ovr,0)/xi.length):0,dv=CLS.div,s=dv.s,cupOpen=(dv.best||10)<=5,fee=2500;
  const L=buildClubXI(),[lo,hi]=divBand(dv.d),band=L.slice(Math.floor(L.length*lo),Math.max(Math.floor(L.length*lo)+1,Math.floor(L.length*hi)));
  const rv=Math.round(band.reduce((a,r)=>a+r.avg,0)/band.length);
  app.innerHTML=clTop()+tiles(avg,ch.team,xi.length)+(full?`<div class="modes" style="margin-top:4px">
    <button class="mode club" id="pdiv" ${en<1?"disabled":""}><i>División ${dv.d} · fecha ${s.p+1} de 7</i><b>Liga de División</b>
      <span>Rivales de media ${rv} aprox. ${s.pts} pts en la temporada (${s.w}G ${s.dr}E ${s.l}P). Con 13 subís, con menos de 8 bajás.</span>
      <em>${en<1?"Sin energía":"1 energía"} · ganar ${fmt(divWin(dv.d))} · fin de temporada ${fmt(1000+(10-dv.d)*700)}+</em></button>
    <button class="mode alt" id="pcup" ${!cupOpen||en<1||CLS.coins<fee?"disabled":""}><i>${cupOpen?"4 partidos · eliminación directa":"Bloqueada"}</i><b>Copa Conmebol</b>
      <span>${cupOpen?"Los mejores onces de Sudamérica. Inscripción de 2.500 monedas y 1 energía por partido.":"Se desbloquea al llegar a División 5."}</span>
      <em>${cupOpen?`500 por partido ganado · campeón +8.000 y un Sobre Oro${CLS.coins<fee?" · te faltan monedas":""}`:`Tu mejor división: ${dv.best||10}`}</em></button>
    <button class="mode" id="pam"><i>Gratis · sin energía</i><b>Amistoso</b><span>Para probar tu once contra un club de tu nivel.</span><em>No da monedas ni cuenta para objetivos</em></button>
   </div>`:`<section class="panel"><h2>Te falta completar el once</h2><p class="sub">Necesitás 11 jugadores para jugar. Armalo en Mi once o abrí sobres.</p><div class="ctrl left" style="margin-top:10px"><button class="btn" data-tab="squad">Ir a mi once</button></div></section>`)
   +`<section class="panel"><p class="label">Cómo funciona</p><p class="sub">Cada partido de División o Copa usa 1 de energía (máximo ${EN_MAX}, se recarga 1 cada 30 minutos). Las temporadas son de 7 fechas: con 13 puntos ascendés, con 8 o más te mantenés y con menos descendés. Cuanto más arriba, más fuertes los rivales y mejores los premios.</p>
   <p class="sub" style="margin-top:6px">Récord: ${CLS.stats.w} ganados · ${CLS.stats.d} empatados · ${CLS.stats.l} perdidos · ${CLS.stats.cups} Copas</p></section>`;
  const $=id=>document.getElementById(id);
  if($("pam"))$("pam").onclick=()=>startClubMatch("amistoso");
  if($("pdiv"))$("pdiv").onclick=()=>startClubMatch("liga");
  if($("pcup"))$("pcup").onclick=()=>{if(CLS.coins<fee)return;CLS.coins-=fee;clSave();startClubMatch("copa")};
}
function startClubMatch(kind){
  const sl=squadPlayers(),L=buildClubXI(),my=sl.reduce((a,p)=>a+p.ovr,0)/11;
  let rivals,stages,rchem=7;
  if(kind==="amistoso"){const near=L.filter(r=>Math.abs(r.avg-my)<=3);rivals=[(near.length?near:L)[rand((near.length?near:L).length)]];stages=["Amistoso"]}
  else if(kind==="liga"){const d=CLS.div.d,[lo,hi]=divBand(d),N=L.length,band=L.slice(Math.floor(N*lo),Math.max(Math.floor(N*lo)+1,Math.floor(N*hi)));
    rivals=[band[rand(band.length)]];stages=[`División ${d} · fecha ${CLS.div.s.p+1}/7`];rchem=divRChem(d)}
  else{const N=L.length,b=(lo,hi2)=>L.slice(Math.floor(N*lo),Math.floor(N*hi2));const seen=new Set();
    rivals=[[.5,.75],[.7,.88],[.85,.96],[.93,1]].map(([lo,hi2])=>{const c=b(lo,hi2).filter(r=>!seen.has(r.c));const r=c[rand(c.length)]||L[N-1];seen.add(r.c);return r});stages=STAGES;rchem=9}
  const rtacs=Object.keys(TACS);
  FD={club:true,kind,rchem,form:CLS.squad.form,slots:sl,cap:clCap(),dt:CLS.squad.dt||null,tac:CLS.tac||"eq",rtac:rivals.map(()=>rtacs[rand(rtacs.length)]),active:null,just:null,opts:[],round:0,rivals,log:[],last:null,stages,step:"pre",toast:[]};
  S={phase:"fd"};render();window.scrollTo(0,0);
}
function clubAfterMatch(){
  const L=FD.last,draw=L.gm===L.gr&&!L.pens;
  if(FD.kind==="amistoso"){L.reward=0;L.extra="Amistoso: no da monedas ni cuenta para objetivos.";clSave();return}
  let c=0;
  if(FD.kind==="liga"){const b=divWin(CLS.div.d),s=CLS.div.s;c=L.win?b:draw?Math.round(b*.4):Math.round(b*.1);
    s.p++;s.pts+=L.win?3:draw?1:0;if(L.win)s.w++;else if(draw)s.dr++;else s.l++;
    L.extra=s.p>=7?seasonEnd():`Temporada: ${s.pts} pts en ${s.p} de 7 fechas.`;
    objEvent("play3");if(L.win)objEvent("win2")}
  if(FD.kind==="copa"){c=L.win?500:0;if(L.win&&FD.round===stg().length-1){c+=8000;CLS.owned.oro=(CLS.owned.oro||0)+1;CLS.stats.cups++;objEvent("cuptitle");L.extra="¡Campeón! También ganaste un Sobre Oro."}
    if(L.win)objEvent("cupwin")}
  CLS.coins+=c;L.reward=c;
  if(L.win)CLS.stats.w++;else if(draw)CLS.stats.d++;else CLS.stats.l++;
  objEvent("goals5",L.gm);
  if(L.win){if(L.gr===0)objEvent("clean");if(fdChem().team>=70)objEvent("chem70");if(FD.rtac&&tacEdge(FD.tac,FD.rtac[FD.round])>0)objEvent("tacwin")}
  clSave();
}

/* ---------- tácticas ---------- */
const TACS={
 eq:{n:"Equilibrado",d:"Sin riesgos: rinde parejo contra cualquiera.",m:[1,1,1]},
 ofe:{n:"Ofensivo",d:"Más gente en el área: hacés más goles pero quedás expuesto atrás.",m:[1.08,1,.93],beats:"con"},
 con:{n:"Contraataque",d:"Esperás y salís rápido. Castiga a los que presionan arriba.",m:[1.04,.95,1.03],beats:"pre"},
 pre:{n:"Presión alta",d:"Recuperás arriba y dominás el medio.",m:[1.02,1.08,.95],beats:"toq"},
 toq:{n:"Toque y posesión",d:"Tenés la pelota y abrís a los equipos cerrados.",m:[1.02,1.06,.99],beats:"def"},
 def:{n:"Defensivo",d:"Bloque bajo y orden: cuesta hacerte goles.",m:[.92,1,1.08],beats:"ofe"},
};
const tacEdge=(a,b)=>TACS[a]&&TACS[a].beats===b?1:TACS[b]&&TACS[b].beats===a?-1:0;
function applyTac(R,mine,rv){const t=TACS[mine]||TACS.eq;R.att*=t.m[0];R.mid*=t.m[1];R.def*=t.m[2];if(tacEdge(mine,rv)>0){R.att*=1.05;R.def*=1.03}}
const clCap=()=>CLS&&CLS.squad.cap&&CLS.squad.slots.some(u=>u&&("u"+u)===CLS.squad.cap)?CLS.squad.cap:null;

/* ---------- objetivos semanales ---------- */
const WOBJ=[["wwin","Ganá 8 partidos de División","win2",8,{c:3000}],["wgoal","Hacé 20 goles en División o Copa","goals5",20,{c:2500}],
 ["wpack","Abrí 6 sobres","packs2",6,{c:1500}],["wsbc","Completá 3 SBC","sbc1",3,{p:"pla"}],["wcup","Ganá una Copa Conmebol","cuptitle",1,{p:"oro"}],
 ["wtrain","Entrená jugadores 3 veces","train",3,{c:2000}],["wbuy","Comprá 2 jugadores en el mercado","buy",2,{c:2000}],
 ["wclean","Ganá 3 partidos sin recibir goles","clean",3,{p:"pla"}],["wtac","Ganá 3 partidos con ventaja táctica","tacwin",3,{c:2500}],["wsell","Vendé 15 cartas","sell5",15,{c:1200}]];
function weekKey(){const d=new Date();const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+3)/7);return "w"+n}
function ensureWeekly(){const k=weekKey();if(!CLS.weekly||CLS.weekly.w!==k){const r=rng(hash(k+"club"));CLS.weekly={w:k,o:WOBJ.map(o=>[o[0],r()]).sort((a,b)=>a[1]-b[1]).slice(0,4).map(x=>({id:x[0],p:0,c:false}))};clSave()}}
const rwText=r=>r.c?fmt(r.c)+" monedas":PACKN[r.p];
function giveRw(r){if(r.c)CLS.coins+=r.c;if(r.p)CLS.owned[r.p]=(CLS.owned[r.p]||0)+1}
function weekLeft(){const d=new Date(),n=(Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5+3)/7)+1)*7-3,ms=n*864e5-Date.now()-d.getTimezoneOffset()*-6e4;const dd=Math.max(0,Math.ceil(ms/864e5));return dd<=1?"último día":dd+" días"}

/* ---------- hitos ---------- */
const sqAvg=()=>{const xi=squadPlayers().filter(Boolean);return xi.length===11?xi.reduce((a,p)=>a+p.ovr,0)/11:0};
const MILES=[
 ["m_w10","10 victorias","Ganá 10 partidos oficiales.",()=>CLS.stats.w>=10,{c:1500}],
 ["m_up","Primer ascenso","Subí de la División 10.",()=>(CLS.div.best||10)<=9,{c:2000}],
 ["m_c50","Plantel largo","Tené 50 cartas en el club.",()=>CLS.cards.length>=50,{c:1500}],
 ["m_avg75","Once de 75","Armá un once con media 75 o más.",()=>sqAvg()>=75,{p:"pla"}],
 ["m_oro5","Vitrina dorada","Tené 5 cartas Oro (80+).",()=>clubCards().filter(p=>p.ovr>=80).length>=5,{p:"pla"}],
 ["m_d5","Mitad de tabla","Llegá a la División 5.",()=>(CLS.div.best||10)<=5,{c:5000}],
 ["m_q100","Química perfecta","Armá tu once con química 100.",()=>squadPlayers().every(Boolean)&&chemFor(CLS.squad.form,squadPlayers(),clCap(),CLS.squad.dt).team>=100,{p:"oro"}],
 ["m_cup","Rey de América","Ganá la Copa Conmebol.",()=>CLS.stats.cups>=1,{p:"oro"}],
 ["m_leg","Leyenda en casa","Tené una Leyenda en el club.",()=>clubCards().some(p=>p.sp==="leyenda"),{c:3000}],
 ["m_w50","50 victorias","Ganá 50 partidos oficiales.",()=>CLS.stats.w>=50,{c:6000}],
 ["m_d1","Primera División","Llegá a la División 1.",()=>(CLS.div.best||10)<=1,{p:"ley"}],
];

/* ---------- mercado de pases ---------- */
function ensureMarket(){if(CLS.market&&CLS.market.d===today())return;const r=rng(hash(today()+"mercado"+(CLS.next%7)));
  const pick=(lo,hi)=>{const c=CMPOOL.filter(p=>p.ovr>=lo&&p.ovr<=hi);return c[Math.floor(r()*c.length)]};
  const it=[[66,70],[70,74],[70,74],[75,79],[75,79],[80,86]].map(([a,b])=>{const p=pick(a,b);return {k:keyOf(p),price:Math.max(400,Math.round(cardVal(p)*4/50)*50),sold:false}});
  CLS.market={d:today(),it};clSave()}
function renderMarket(){
  ensureMarket();
  app.innerHTML=clTop()+`<section class="panel"><h2>Mercado de pases</h2><p class="sub">Seis jugadores en venta hoy. Se renuevan todos los días. Cuestan bastante más de lo que se venden: elegí bien.</p>
   <div class="mkt">${CLS.market.it.map((x,i)=>{const p=PKEY.get(x.k);if(!p)return "";return `<div class="mki ${x.sold?"sold":""}">${cardHTML(p,{tag:"div"})}
     <button class="btn ${CLS.coins<x.price||x.sold?"ghost":""}" data-mk="${i}" ${x.sold||CLS.coins<x.price?"disabled":""}>${x.sold?"Comprado":fmt(x.price)+" monedas"}</button></div>`}).join("")}</div></section>`;
  app.querySelectorAll("[data-mk]").forEach(b=>b.onclick=()=>{const x=CLS.market.it[+b.dataset.mk];if(x.sold||CLS.coins<x.price)return;CLS.coins-=x.price;x.sold=true;addCard(PKEY.get(x.k));objEvent("buy");clSave();render()});
}

/* ---------- entrenamiento ---------- */
const trainCost=p=>{const t=p.tr||0;return Math.round((600+Math.max(0,p.ovr-t-60)*120)*(t+1)/50)*50};

/* ---------- pantalla de objetivos ---------- */
function renderObjs(){
  ensureDaily();ensureWeekly();
  const row=(t,p,goal,rw,claimed,attr)=>{const done=p>=goal;return `<div class="obj ${claimed?"claimed":done?"done":""}"><div><b>${esc(t)}</b><span>${Math.min(p,goal)}/${goal} · premio ${esc(rw)}</span><i><em style="width:${Math.min(100,p/goal*100)}%"></em></i></div>${claimed?'<span class="okt">Cobrado</span>':done?`<button class="btn sm" ${attr}>Cobrar</button>`:""}</div>`};
  app.innerHTML=clTop()+`<section class="panel"><h2>Objetivos de hoy</h2><div class="objs">${CLS.daily.o.map(o=>{const d=OBJ.find(x=>x[0]===o.id);return row(d[1],o.p,d[2],fmt(d[3])+" monedas",o.c,`data-claim="${o.id}"`)}).join("")}</div></section>
   <section class="panel"><h2>Objetivos de la semana <small class="achn">quedan ${weekLeft()}</small></h2><div class="objs">${CLS.weekly.o.map(o=>{const d=WOBJ.find(x=>x[0]===o.id);return row(d[1],o.p,d[3],rwText(d[4]),o.c,`data-wclaim="${o.id}"`)}).join("")}</div></section>
   <section class="panel"><h2>Hitos del club <small class="achn">${MILES.filter(m=>CLS.miles&&CLS.miles[m[0]]).length}/${MILES.length}</small></h2><div class="objs">${MILES.map(m=>{const got=CLS.miles&&CLS.miles[m[0]],ok=!got&&m[3]();
     return `<div class="obj ${got?"claimed":ok?"done":""}"><div><b>${esc(m[1])}</b><span>${esc(m[2])} · premio ${esc(rwText(m[4]))}</span></div>${got?'<span class="okt">Cobrado</span>':ok?`<button class="btn sm" data-mile="${m[0]}">Cobrar</button>`:""}</div>`}).join("")}</div></section>`;
  app.querySelectorAll("[data-wclaim]").forEach(b=>b.onclick=()=>{const o=CLS.weekly.o.find(x=>x.id===b.dataset.wclaim),d=WOBJ.find(x=>x[0]===o.id);if(o.p>=d[3]&&!o.c){o.c=true;giveRw(d[4]);clSave();render()}});
  app.querySelectorAll("[data-mile]").forEach(b=>b.onclick=()=>{const m=MILES.find(x=>x[0]===b.dataset.mile);CLS.miles=CLS.miles||{};if(CLS.miles[m[0]]||!m[3]())return;CLS.miles[m[0]]=Date.now();giveRw(m[4]);clSave();render()});
}
function renderClub(){
  if(!CLS)clLoad();ensureDaily();clearTimeout(CL_T);
  const v=CL.view;
  if(v==="packs")renderPacks();else if(v==="open")renderOpen();else if(v==="club")renderClubList();else if(v==="squad")renderSquad();
  else if(v==="sbcs")renderSbcList();else if(v==="sbc")renderSbc();else if(v==="play")renderPlay();else if(v==="market")renderMarket();else if(v==="objs")renderObjs();else renderHub();
  app.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{CL={view:b.dataset.tab,f:CL.f};render();window.scrollTo(0,0)});
  app.querySelectorAll("[data-own]").forEach(b=>b.onclick=()=>{const k=b.dataset.own;if(!CLS.owned[k])return;CLS.owned[k]--;clSave();openPack(k)});
  app.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const pk=PACKS.find(x=>x.id===b.dataset.buy);if(CLS.coins<pk.price)return;CLS.coins-=pk.price;clSave();openPack(pk.id)});
  app.querySelectorAll("[data-claim]").forEach(b=>b.onclick=()=>{const o=CLS.daily.o.find(x=>x.id===b.dataset.claim),d=OBJ.find(x=>x[0]===o.id);if(o.p>=d[2]&&!o.c){o.c=true;CLS.coins+=d[3];clSave();render()}});
}

function render(){
  clearTimeout(LIVE_T);
  if(S.phase==="home")renderHome();else if(S.phase==="fd")renderFD();else if(S.phase==="draft")renderDraft();else renderMatch();
  const h=document.getElementById("home");
  if(h)h.onclick=()=>{S={phase:"home"};render();window.scrollTo(0,0)};
}

S={phase:"home"};render();
</script>

    return Math.min(3,th(cl[p.c]||0,[2,5,7])+th((lg[p.lg]||0)+icons,[3,5,8])+th(na[p.nat]||0,[2,5,8]))});

};
